  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  ::-webkit-scrollbar{display:none;}
  body{background:#1a1a2e;font-family:'Segoe UI',Arial,sans-serif;color:#f0e6d3;max-width:430px;margin:0 auto;min-height:100vh;}

  /* HEADER */
  .header{background:linear-gradient(135deg,#16213e,#0f3460);padding:14px 16px 0;border-bottom:3px solid #e8b84b;position:sticky;top:0;z-index:100;}
  .header-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .logo{display:flex;align-items:center;gap:10px;}
  .logo-icon{width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#f5c842,#c0392b);display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 0 0 2px #e8b84b55;flex-shrink:0;}
  .logo-text .title{font-size:16px;font-weight:bold;color:#e8b84b;text-transform:uppercase;letter-spacing:.04em;}
  .logo-text .subtitle{font-size:10px;color:#8899aa;letter-spacing:.1em;text-transform:uppercase;}
  .fase-badge{background:#c0392b;color:#fff;font-size:10px;font-weight:bold;padding:3px 8px;border-radius:10px;}

  /* NAV */
  .nav{display:flex;}
  .nav-btn{flex:1;padding:10px 4px;font-size:10px;font-weight:bold;letter-spacing:.06em;text-transform:uppercase;border:none;background:transparent;color:#8899aa;border-bottom:3px solid transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:inherit;transition:all .2s;}
  .nav-btn.active{color:#e8b84b;border-bottom:3px solid #e8b84b;}
  .nav-icon{font-size:18px;}

  /* BODY */
  .body{padding:14px 14px 80px;}

  /* FILTERS */
  .filter-row{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;}
  .filter-row.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;}
  .f-btn{padding:6px 12px;border-radius:16px;border:1px solid #0f3460;background:transparent;color:#8899aa;font-weight:bold;cursor:pointer;font-size:11px;font-family:inherit;white-space:nowrap;transition:all .2s;}
  .f-btn.active{background:#e8b84b;border-color:#e8b84b;color:#000;}

  /* CARDS */
  .card{background:#16213e;border:1px solid #0f3460;border-radius:12px;padding:12px;margin-bottom:8px;}
  .match-card{background:linear-gradient(135deg,#16213e,#0f3460);border:1px solid #e8b84b33;border-radius:12px;padding:12px 14px;margin-bottom:8px;}
  .match-meta{font-size:10px;color:#8899aa;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;}
  .match-teams{display:flex;align-items:center;justify-content:space-between;}
  .team-name{flex:1;font-size:12px;font-weight:bold;color:#f0e6d3;text-align:center;line-height:1.3;}
  .vs-box{text-align:center;flex-shrink:0;padding:0 8px;}
  .vs-icon{font-size:18px;}
  .vs-text{font-size:10px;color:#8899aa;font-weight:bold;}
  .vs-field{font-size:10px;color:#8899aa;}

  /* WEEK TAG */
  .week-tag{font-size:9px;font-weight:bold;padding:2px 7px;border-radius:8px;}

  /* TEAM CARD */
  .team-card{background:#0f3460;border-radius:12px;padding:12px;margin-bottom:8px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;transition:opacity .2s;}
  .team-card:active{opacity:.7;}
  .team-card-name{font-size:14px;font-weight:bold;color:#f0e6d3;}
  .team-card-sub{font-size:11px;color:#8899aa;margin-top:2px;}
  .arrow{font-size:20px;color:#8899aa;}

  /* PLAYER LIST */
  .player-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;margin-bottom:5px;background:#16213e;border:1px solid #0f3460;}
  .player-num{width:24px;height:24px;border-radius:50%;background:#0f3460;display:flex;align-items:center;justify-content:center;font-size:10px;color:#8899aa;font-weight:bold;flex-shrink:0;}
  .player-name-text{font-size:13px;color:#f0e6d3;}

  /* BACK BTN */
  .back-btn{padding:6px 14px;border-radius:20px;border:1px solid #0f3460;background:transparent;color:#8899aa;cursor:pointer;font-size:12px;font-family:inherit;margin-bottom:14px;}

  /* STANDING */
  .stand-row{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:10px;margin-bottom:5px;}
  .stand-row.r1{background:linear-gradient(90deg,#e8b84b22,transparent);border:1px solid #e8b84b33;}
  .stand-row.r2{background:linear-gradient(90deg,#c0c0c022,transparent);border:1px solid #0f3460;}
  .stand-row.r3{background:linear-gradient(90deg,#cd7f3222,transparent);border:1px solid #0f3460;}
  .stand-row.rn{background:#16213e;border:1px solid #0f3460;}
  .rank-badge{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:bold;flex-shrink:0;}
  .rank-badge.r1{background:#e8b84b;color:#000;}
  .rank-badge.r2{background:#c0c0c0;color:#000;}
  .rank-badge.r3{background:#cd7f32;color:#000;}
  .rank-badge.rn{background:#0f3460;color:#8899aa;}
  .stand-name{flex:1;font-size:12px;font-weight:bold;color:#f0e6d3;line-height:1.2;}
  .stat-cols{display:flex;gap:8px;}
  .stat-c{text-align:center;min-width:26px;}
  .stat-v{font-size:12px;font-weight:bold;color:#f0e6d3;}
  .stat-pts{font-size:14px;font-weight:bold;color:#e8b84b;}
  .stat-head{font-size:9px;color:#e8b84b;font-weight:bold;}

  .section-label{font-size:11px;color:#e8b84b;font-weight:bold;margin-bottom:10px;margin-top:6px;letter-spacing:.1em;}
  .info-box{font-size:10px;color:#8899aa;padding:10px;background:#16213e;border-radius:10px;border:1px solid #0f3460;margin-top:10px;}

  .screen{display:none;}
  .screen.active{display:block;}
</style>
</head>

// ══ STATE ══════════════════════════════════════════════════════════════════════
let state = {
  tab: 'teams',
  teamCat: 'Femenino', teamGrp: 'A',
  mCat: 'Femenino', mGrp: 'A', mWeek: 'Todos',
  sCat: 'Femenino', sGrp: 'A',
  detail: null
};

// ══ TAB ═══════════════════════════════════════════════════════════════════════
function showTab(id, btn) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('screen-'+id).classList.add('active');
  btn.classList.add('active');
  state.tab = id;
  if(id==='matches') renderMatches();
  if(id==='standings') renderStandings();
  if(id==='teams') renderTeams();
}

// ══ TEAMS ══════════════════════════════════════════════════════════════════════
function setCat(v){ state.teamCat=v; document.getElementById('cat-fem').classList.toggle('active',v==='Femenino'); document.getElementById('cat-mas').classList.toggle('active',v==='Masculino'); renderTeams(); }
function setGrp(v){ state.teamGrp=v; document.getElementById('grp-a').classList.toggle('active',v==='A'); document.getElementById('grp-b').classList.toggle('active',v==='B'); renderTeams(); }

function renderTeams(){
  const list = teams.filter(t=>t.category===state.teamCat && t.group===state.teamGrp);
  document.getElementById('teams-count').textContent = list.length+' EQUIPOS';
  const el = document.getElementById('teams-list');
  el.innerHTML = list.map((t,i)=>`
    <div class="team-card" onclick="openDetail(${i+(state.teamCat==='Femenino'?(state.teamGrp==='A'?0:10):(state.teamGrp==='A'?20:31))})">
      <div>
        <div class="team-card-name">${t.name}</div>
        <div class="team-card-sub">${t.players.length} jugadores · Grupo ${t.group}</div>
      </div>
      <div class="arrow">›</div>
    </div>
  `).join('');
}

function openDetail(idx){
  const t = teams[idx];
  document.getElementById('teams-list').style.display='none';
  document.getElementById('team-detail').style.display='block';
  document.getElementById('detail-name').textContent = t.name;
  document.getElementById('detail-sub').textContent = `${t.category} · Grupo ${t.group} · ${t.players.length} jugadores`;
  document.getElementById('detail-players').innerHTML = t.players.map((p,i)=>`
    <div class="player-item">
      <div class="player-num">${i+1}</div>
      <div class="player-name-text">${p}</div>
    </div>
  `).join('');
}

function closeDetail(){
  document.getElementById('teams-list').style.display='block';
  document.getElementById('team-detail').style.display='none';
}

// ══ MATCHES ════════════════════════════════════════════════════════════════════
function setMCat(v){ state.mCat=v; document.getElementById('mcat-fem').classList.toggle('active',v==='Femenino'); document.getElementById('mcat-mas').classList.toggle('active',v==='Masculino'); renderMatches(); }
function setMGrp(v){ state.mGrp=v; document.getElementById('mgrp-a').classList.toggle('active',v==='A'); document.getElementById('mgrp-b').classList.toggle('active',v==='B'); renderMatches(); }
function setMWeek(v){ state.mWeek=v; renderMatches(); }

function renderMatches(){
  // Week filters
  const weeks = ['Todos','Semana 1','Semana 2','Semana 3','Semana 4','Semana 5','Semana 6','Semana 7','Semana 8'];
  document.getElementById('week-filters').innerHTML = weeks.map(w=>`
    <button class="f-btn ${state.mWeek===w?'active':''}" onclick="setMWeek('${w}')">${w}</button>
  `).join('');

  const list = matches.filter(m=>m.category===state.mCat && m.group===state.mGrp && (state.mWeek==='Todos'||m.week===state.mWeek));
  document.getElementById('matches-count').textContent = list.length+' PARTIDOS';

  const color = weekColors;
  document.getElementById('matches-list').innerHTML = list.length===0
    ? '<div style="color:#8899aa;text-align:center;margin-top:30px;font-size:13px;">No hay partidos para estos filtros</div>'
    : list.map(m=>`
    <div class="match-card">
      <div class="match-meta">
        <span>📅 ${m.date} · ${m.day} · ${m.hour}</span>
        <span class="week-tag" style="background:${color[m.week]||'#8899aa'}33;color:${color[m.week]||'#8899aa'}">${m.week}</span>
      </div>
      <div class="match-teams">
        <div class="team-name">${m.teamA}</div>
        <div class="vs-box">
          <div class="vs-icon">🎯</div>
          <div class="vs-text">VS</div>
          <div class="vs-field">${m.field}</div>
        </div>
        <div class="team-name">${m.teamB}</div>
      </div>
    </div>
  `).join('');
}

// ══ STANDINGS ══════════════════════════════════════════════════════════════════
function setSCat(v){ state.sCat=v; document.getElementById('scat-fem').classList.toggle('active',v==='Femenino'); document.getElementById('scat-mas').classList.toggle('active',v==='Masculino'); renderStandings(); }
function setSGrp(v){ state.sGrp=v; document.getElementById('sgrp-a').classList.toggle('active',v==='A'); document.getElementById('sgrp-b').classList.toggle('active',v==='B'); renderStandings(); }

function renderStandings(){
  const list = teams.filter(t=>t.category===state.sCat && t.group===state.sGrp);
  const rankClass = r => r===1?'r1':r===2?'r2':r===3?'r3':'rn';
  const header = `
    <div class="card" style="display:flex;gap:8px;align-items:center;padding:8px 10px;margin-bottom:6px;">
      <div style="width:22px"></div>
      <div style="flex:1;font-size:9px;color:#8899aa;">EQUIPO</div>
      <div class="stat-cols">${['PJ','PG','PP','PF','PC','PTS'].map(h=>`<div class="stat-c stat-head">${h}</div>`).join('')}</div>
    </div>`;
  const rows = list.map((t,i)=>{
    const r=i+1, rc=rankClass(r);
    return `
      <div class="stand-row ${rc}">
        <div class="rank-badge ${rc}">${r}</div>
        <div class="stand-name">${t.name}</div>
        <div class="stat-cols">
          <div class="stat-c"><div class="stat-v">0</div></div>
          <div class="stat-c"><div class="stat-v">0</div></div>
          <div class="stat-c"><div class="stat-v">0</div></div>
