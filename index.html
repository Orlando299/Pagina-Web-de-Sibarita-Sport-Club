    <style>
        body {
            background: #1a1a2e;
            color: #f0e6d3;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }
        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        .loading img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid #e8b84b;
            animation: pulso 1.5s ease-in-out infinite;
        }
        @keyframes pulso {
            0%, 100% { transform: scale(1); box-shadow: 0 0 20px rgba(232, 184, 75, 0.4); }
            50%      { transform: scale(1.05); box-shadow: 0 0 40px rgba(232, 184, 75, 0.7); }
        }
        .loading p {
            color: #e8b84b;
            font-size: 1rem;
            font-weight: 600;
        }
        .loading a {
            color: #e8b84b;
            text-decoration: underline;
            font-size: 0.85rem;
        }
    </style>
</head>
