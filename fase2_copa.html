<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a1a2c">
<title>Fase 2 · Copa Navidad 2026 | Sibarita Sport Club</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script type="module" src="https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js"></script>

<style>
:root{
  --primary:#2ecc71; --primary-dark:#27ae60; --primary-light:#2ecc71;
  --bg:#0a1a2c; --bg-grad-1:#0f2438; --bg-grad-2:#08121f;
  --card:#0f2438; --card-2:#16213e; --border:#2ecc7155;
  --text:#e8f0f8; --text-muted:#94a3b8;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: linear-gradient(135deg, var(--bg-grad-1), var(--bg-grad-2)); font-family: 'Segoe UI', Arial, sans-serif; color: var(--text); max-width: 430px; margin: 0 auto; min-height: 100vh; }
.hdr { background: linear-gradient(135deg, var(--card-2), #0f2438); padding: 10px 14px 0; border-bottom: 3px solid var(--primary); position: sticky; top: 0; z-index: 100; }
.hdr-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.logo { display: flex; align-items: center; gap: 8px; }
.logo img { width: 38px; height: 38px; border-radius: 50%; border: 2px solid var(--primary); object-fit: cover; }
.logo-t { font-size: 13px; font-weight: bold; color: var(--primary); text-transform: uppercase; line-height: 1.1; }
.logo-s { font-size: 9px; color: var(--text-muted); text-transform: uppercase; }
.btn-nav { background: var(--primary); color: #000; padding: 5px 10px; border-radius: 8px; font-weight: bold; font-size: 9px; text-transform: uppercase; text-decoration: none; }
.nav { display: flex; flex-wrap: wrap; }
.nb { flex: 1; min-width: 50px; padding: 8px 2px; font-size: 9px; font-weight: bold; text-transform: uppercase; border: none; background: transparent; color: var(--text-muted); border-bottom: 3px solid transparent; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; font-family: inherit; text-decoration: none; }
.nb.on { color: var(--primary); border-bottom: 3px solid var(--primary); }
.nb span { font-size: 15px; }
.body { padding: 12px 12px 70px; }
.fb { padding: 5px 10px; border-radius: 12px; border: 1px solid var(--border); background: transparent; color: var(--text-muted); font-weight: bold; cursor: pointer; font-size: 11px; font-family: inherit; }
.fb.on { background: var(--primary); border-color: var(--primary); color: #000; }
.frow { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
.fscroll { display: flex; gap: 6px; margin-bottom: 8px; overflow-x: auto; padding-bottom: 3px; flex-wrap: nowrap; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 10px; margin-bottom: 7px; }
.mc { background: linear-gradient(135deg, var(--card), var(--card-2)); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin-bottom: 7px; }
.mm { font-size: 10px; color: var(--text-muted); margin-bottom: 7px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 3px; }
.mteams { display: flex; align-items: center; justify-content: space-between; }
.tn { flex: 1; font-size: 11px; font-weight: bold; color: var(--text); text-align: center; line-height: 1.3; }
.vb { text-align: center; flex-shrink: 0; padding: 0 5px; }
.ss { font-size: 24px; font-weight: bold; color: var(--primary); min-width: 30px; text-align: center; }
.ss.l { color: var(--text-muted); }
.sep { font-size: 16px; color: var(--text-muted); font-weight: bold; }
.sbtn { width: 100%; margin-top: 6px; padding: 6px; background: #2ecc71; border: none; border-radius: 7px; color: #000; font-weight: bold; font-size: 12px; cursor: pointer; font-family: inherit; }
.fbtn { width: 100%; margin-top: 4px; padding: 5px; background: transparent; border: 1px solid #c0392b55; border-radius: 7px; color: #c0392b; font-size: 10px; cursor: pointer; font-family: inherit; }
.wtag { font-size: 9px; font-weight: bold; padding: 2px 6px; border-radius: 7px; }
.sinp { width: 46px; height: 34px; background: var(--card-2); border: 1px solid var(--border); border-radius: 7px; color: var(--primary); font-size: 18px; font-weight: bold; text-align: center; font-family: inherit; }
.srow { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 6px; }
.sr { display: flex; align-items: center; gap: 6px; padding: 7px 8px; border-radius: 8px; margin-bottom: 4px; }
.r1 { background: linear-gradient(90deg, var(--primary)22, transparent); border: 1px solid var(--primary)33; }
.rn { background: var(--card-2); border: 1px solid var(--border); }
.rb { width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; flex-shrink: 0; }
.rb.r1 { background: var(--primary); color: #000; }
.rb.rn { background: var(--card); color: var(--text-muted); }
.sv { font-size: 11px; font-weight: bold; color: var(--text); }
.sh { font-size: 8px; color: var(--primary); font-weight: bold; }
.scols { display: flex; gap: 4px; }
.sc { text-align: center; min-width: 22px; }
.lbl { font-size: 10px; color: var(--primary); font-weight: bold; margin-bottom: 7px; margin-top: 4px; letter-spacing: .06em; }
.ibox { font-size: 10px; color: var(--text-muted); padding: 9px; background: var(--card-2); border-radius: 9px; border: 1px solid var(--border); margin-top: 7px; line-height: 1.5; }
.scr { display: none; } .scr.on { display: block; }
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-top">
    <div class="logo">
      <img src="https://i.imgur.com/HbKo42m.png" alt="Logo">
      <div>
        <div class="logo-t">Sibarita Sport Club</div>
        <div class="logo-s">Fase 2 · Copa Navidad</div>
      </div>
    </div>
    <a href="index.html" class="btn-nav">🏠 Inicio</a>
  </div>
  <div class="nav">
    <button class="nb on" onclick="showTab('matches',this)"><span>🎯</span>Partidos</button>
    <button class="nb" onclick="showTab('standings',this)"><span>🏆</span>Tabla</button>
  </div>
</div>

<div class="body">

  <!-- ===== PARTIDOS ===== -->
  <div id="s-matches" class="scr on">
    <div class="frow">
      <button class="fb on" id="btn-mFem" onclick="setF('mCat','Femenino')">👩 Femenino</button>
      <button class="fb" id="btn-mMas" onclick="setF('mCat','Masculino')">👨 Masculino</button>
    </div>
    <div class="fscroll" id="m-weeks"></div>
    <div class="lbl" id="m-cnt"></div>
    <div id="m-list"></div>
  </div>

  <!-- ===== TABLA ===== -->
  <div id="s-standings" class="scr">
    <div class="frow">
      <button class="fb on" id="btn-sFem" onclick="setF('sCat','Femenino')">👩 Femenino</button>
      <button class="fb" id="btn-sMas" onclick="setF('sCat','Masculino')">👨 Masculino</button>
    </div>
    <div id="st-list"></div>
    <div class="ibox">📌 Clasifican los 4 primeros a las eliminatorias.<br>📌 Criterios: Puntos → Rendimiento → Average → Sorteo.</div>
  </div>

</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
  import { getFirestore, collection, getDocs, doc, setDoc } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDXIPkeLn5oVn_q-NO1Xm7tc9E6MPfU-cU",
    authDomain: "sibarita-torneo-bolas-criollas.firebaseapp.com",
    projectId: "sibarita-torneo-bolas-criollas",
    storageBucket: "sibarita-torneo-bolas-criollas.firebasestorage.app",
    messagingSenderId: "466460618853",
    appId: "1:466460618853:web:52660cd99bba610d6e568c"
  };
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // ============================================================
  // CLASIFICADOS CONFIRMADOS (EXTRAÍDOS DE LA TABLA DE POSICIONES)
  // ============================================================
  const CLASIFICADOS = {
    Femenino: {
      G1: ["Chikas B", "Corpoelec", "Auto Tapicería Veliz", "Jujure (Educadoras)", "Virtud Femenina", "New Family"], 
      G2: ["Divinas", "Team Frutas", "Las Triunfadoras", "Las Queen", "T-Teen Club", "Repostería el Ponque"]
    },
    Masculino: {
      G1: ["Pintucal", "Sibarita", "Team JM&JA", "Cultivar", "Servihidra", "Poder Justiciable", "La 23 de Araure"], 
      G2: ["Exasa", "Triunfadores", "Deportivo Guaimaral", "Micro PC", "Feria Bolivariana", "Remodica", "La 1"]
    }
  };

  // ============================================================
  // PARTIDOS FASE 2 (EXTRAÍDOS DE TU IMAGEN)
  // ============================================================
   // ============================================================
  // PARTIDOS FASE 2 (SEMANA 1 COMPLETADA Y CORREGIDA)
  // ============================================================
  const MATCHES_F2 = [
    // ===== F2-S1: Viernes 13/11 =====
    { id: "F2-M-01", c: "Masculino", g: "F2", w: "F2-S1", a: "Deportivo Guaimaral", b: "Chumacera", d: "13/11/2026", h: "6:00pm", f: "Cancha 1" },
    { id: "F2-M-02", c: "Masculino", g: "F2", w: "F2-S1", a: "Team Suárez", b: "Feria Bolivariana", d: "13/11/2026", h: "6:00pm", f: "Cancha 2" },
    { id: "F2-M-03", c: "Masculino", g: "F2", w: "F2-S1", a: "Cultivar", b: "Poder Justiciable", d: "13/11/2026", h: "6:00pm", f: "Cancha 3" },
    { id: "F2-F-01", c: "Femenino",  g: "F2", w: "F2-S1", a: "New Family", b: "Repostería el Ponque", d: "13/11/2026", h: "8:30pm", f: "Cancha 1" },

    // ===== F2-S1: Sábado 14/11 =====
    { id: "F2-M-04", c: "Masculino", g: "F2", w: "F2-S1", a: "Triunfadores", b: "Pintucal", d: "14/11/2026", h: "6:00pm", f: "Cancha 1" },
    
    { id: "F2-F-02", c: "Femenino",  g: "F2", w: "F2-S1", a: "Las Triunfadoras", b: "Corpoelec", d: "14/11/2026", h: "8:30pm", f: "Cancha 1" },
    { id: "F2-M-05", c: "Masculino", g: "F2", w: "F2-S1", a: "Micro PC", b: "Team JM&JA", d: "14/11/2026", h: "8:30pm", f: "Cancha 2" },
    { id: "F2-M-06", c: "Masculino", g: "F2", w: "F2-S1", a: "Deportivo Guaimaral", b: "Cultivar", d: "14/11/2026", h: "8:30pm", f: "Cancha 3" },

    // ===== F2-S1: Domingo 15/11 =====
    { id: "F2-F-03", c: "Femenino",  g: "F2", w: "F2-S1", a: "T-Teen Club", b: "Chikas B", d: "15/11/2026", h: "4:00pm", f: "Cancha 1" },
    
    { id: "F2-F-04", c: "Femenino",  g: "F2", w: "F2-S1", a: "Jujure (Educadoras)", b: "Repostería el Ponque", d: "15/11/2026", h: "6:00pm", f: "Cancha 1" },
    { id: "F2-F-05", c: "Femenino",  g: "F2", w: "F2-S1", a: "Las Triunfadoras", b: "Auto Tapicería Veliz", d: "15/11/2026", h: "6:00pm", f: "Cancha 2" }
  ];

   let R = {}; 
  window.F = { mCat: 'Femenino', sCat: 'Femenino', mWk: 'Todas' };
  const CLAVE_ADMIN = 'sibarita2026';
  function g(id) { return document.getElementById(id); }

  window.showTab = function(id, btn) {
    document.querySelectorAll('.scr').forEach(s => s.classList.remove('on'));
    document.querySelectorAll('.nb').forEach(b => b.classList.remove('on'));
    g('s-' + id).classList.add('on');
    if (btn) btn.classList.add('on');
    if (id === 'matches') rM();
    if (id === 'standings') rSt();
  }

  window.setF = function(k, v) {
    F[k] = v;
    const maps = { 
      mCat: { Femenino: 'btn-mFem', Masculino: 'btn-mMas' },
      sCat: { Femenino: 'btn-sFem', Masculino: 'btn-sMas' }
    };
    if (maps[k]) {
      Object.keys(maps[k]).forEach(val => {
        const el = g(maps[k][val]);
        if (el) el.classList.toggle('on', val === v);
      });
    }
    if (k[0] === 'm') rM();
    if (k[0] === 's') rSt();
  }

  // --- PARTIDOS ---
  function rM() {
    const weeksEl = g('m-weeks');
    const cntEl = g('m-cnt');
    const listEl = g('m-list');

    const partidosCat = MATCHES_F2.filter(m => m.c === F.mCat);
    const semanas = [...new Set(partidosCat.map(m => m.w))].sort();

    let tabsHTML = `<button class="fb ${F.mWk==='Todas'?'on':''}" onclick="F.mWk='Todas';rM();">Todas</button>`;
    semanas.forEach(w => {
      tabsHTML += `<button class="fb ${F.mWk===w?'on':''}" onclick="F.mWk='${w}';rM();">Sem ${w.replace('F2-S','')}</button>`;
    });
    weeksEl.innerHTML = tabsHTML;

    const list = F.mWk === 'Todas' ? partidosCat : partidosCat.filter(m => m.w === F.mWk);
    cntEl.textContent = `${list.length} PARTIDOS — ${F.mCat}`;

    if (!list.length) { listEl.innerHTML = '<div style="text-align:center;padding:20px;">Sin partidos registrados</div>'; return; }

    listEl.innerHTML = list.map(m => {
      const r = R[m.id];
      const done = r && r.status === 'done';
      const wA = done && r.scoreA > r.scoreB;
      const wB = done && r.scoreB > r.scoreA;
      
      let inner = '';
      if (done) {
        inner = `<div style="display:flex;align-items:center;gap:5px;justify-content:center;">
          <span class="ss ${wA?'':'l'}">${r.scoreA}</span><span class="sep">—</span><span class="ss ${wB?'':'l'}">${r.scoreB}</span>
        </div><div style="text-align:center;margin-top:4px;"><span class="wtag" style="background:#2ecc7133;color:#2ecc71;">✓ Final</span></div>`;
      } else {
        inner = `<div class="srow">
            <input class="sinp" id="sA${m.id}" type="number" min="0" max="20" placeholder="0">
            <span class="sep">—</span>
            <input class="sinp" id="sB${m.id}" type="number" min="0" max="20" placeholder="0">
          </div>
          <button class="sbtn" onclick="guardar('${m.id}')">💾 Guardar</button>`;
      }

      return `<div class="mc">
        <div class="mm"><span>📅 ${m.d} ${m.h} · ${m.f}</span>${done?'<span class="wtag" style="background:#2ecc7133;color:#2ecc71;">✓</span>':''}</div>
        <div class="mteams">
          <div class="tn" style="color:${wA?'var(--primary)':''}">${m.a}</div>
          <div class="vb">${inner}</div>
          <div class="tn" style="color:${wB?'var(--primary)':''}">${m.b}</div>
        </div>
      </div>`;
    }).join('');
  }

  // --- TABLA (DOS BLOQUES PARALELOS POR GRUPO) ---
  function rSt() {
    const grupos = CLASIFICADOS[F.sCat];
    
    function calcTabla(equiposGrupo) {
      const tb = {};
      // Inicializar los equipos del grupo
      equiposGrupo.forEach(eq => {
        tb[eq] = { n: eq, pj: 0, pg: 0, pp: 0, tf: 0, tc: 0, pts: 0 };
      });
      
      // Sumar los resultados de la Fase 2
      const partidosCat = MATCHES_F2.filter(m => m.c === F.sCat);
      partidosCat.forEach(m => {
        const r = R[m.id];
        if (!r || r.status !== 'done') return;

        // Verificar si el equipo pertenece a este grupo
        if (tb[m.a]) {
          tb[m.a].pj++; tb[m.a].tf += r.scoreA; tb[m.a].tc += r.scoreB;
          if (r.scoreA > r.scoreB) { tb[m.a].pg++; tb[m.a].pts += 3; } else { tb[m.a].pp++; }
        }
        if (tb[m.b]) {
          tb[m.b].pj++; tb[m.b].tf += r.scoreB; tb[m.b].tc += r.scoreA;
          if (r.scoreB > r.scoreA) { tb[m.b].pg++; tb[m.b].pts += 3; } else { tb[m.b].pp++; }
        }
      });
      
      // Ordenar por Puntos -> Rendimiento -> Average
      return Object.values(tb).sort((a, b) => {
        if (b.pts !== a.pts) return b.pts - a.pts;
        const rendA = a.pj ? a.pg / a.pj : 0;
        const rendB = b.pj ? b.pg / b.pj : 0;
        if (rendB !== rendA) return rendB - rendA;
        const avgA = a.pj ? (a.tf - a.tc) / a.pj : 0;
        const avgB = b.pj ? (b.tf - b.tc) / b.pj : 0;
        return avgB - avgA;
      });
    }

    const renderTablaHTML = (tabla, nombreGrupo) => {
      let html = `<div class="card" style="padding: 12px; border: 1px solid var(--border);">`;
      html += `<div style="text-align: center; font-weight: bold; color: var(--primary); font-size: 13px; margin-bottom: 10px; text-transform: uppercase;">🏆 ${nombreGrupo}</div>`;
      
      // Cabecera de la tabla
      html += `<div style="display:flex; gap:5px; padding: 4px 6px; font-size: 9px; color: var(--text-muted); border-bottom: 1px solid var(--border); margin-bottom: 6px;">
        <div style="width: 22px; text-align:center;">#</div>
        <div style="flex: 1;">EQUIPO</div>
        <div class="scols">${['PJ','PG','PP','TF','TC','DIF','PTS'].map(h=>`<div class="sc">${h}</div>`).join('')}</div>
      </div>`;
      
      // Filas de los equipos
      html += tabla.map((t, i) => {
        return `<div class="sr rn" style="padding: 6px 6px; margin-bottom: 2px;">
          <div style="width: 22px; text-align: center; font-weight: bold; color: var(--text-muted); font-size: 11px;">${i + 1}</div>
          <div style="flex: 1; font-size: 11px; font-weight: 600; color: var(--text); text-align: left;">${t.n}</div>
          <div class="scols">
            ${[t.pj, t.pg, t.pp, t.tf, t.tc, (t.tf - t.tc), t.pts].map(v => `<div class="sc"><div class="sv" style="font-size:10px;">${v}</div></div>`).join('')}
          </div>
        </div>`;
      }).join('');
      
      html += `</div>`;
      return html;
    };

    // Renderizar los dos grupos en paralelo (uno debajo del otro en pantalla móvil)
    const htmlA = renderTablaHTML(calcTabla(grupos.G1), "Grupo A");
    const htmlB = renderTablaHTML(calcTabla(grupos.G2), "Grupo B");

    // Contenedor con flexbox para que se separen bien
    g('st-list').innerHTML = `<div style="display: flex; flex-direction: column; gap: 15px;">${htmlA}${htmlB}</div>`;
  }

  // --- GUARDAR RESULTADO ---
  window.guardar = async function(id) {
    const pass = prompt('🔐 Contraseña de organizador:');
    if (pass !== CLAVE_ADMIN) { alert('❌ Incorrecta'); return; }
    
    const a = parseInt(g('sA' + id)?.value);
    const b = parseInt(g('sB' + id)?.value);
    
    if (isNaN(a) || isNaN(b) || a < 0 || a > 20 || b < 0 || b > 20) {
      alert('Marcador inválido (0-20)'); return;
    }
    
    R[id] = { scoreA: a, scoreB: b, status: 'done' };
    try {
      await setDoc(doc(db, "resultados", String(id)), { ...R[id], torneo: "navidad", categoria: "B" });
      alert('✅ Guardado');
    } catch (e) {
      console.error(e);
      alert('⚠️ Guardado local');
    }
    rM(); rSt();
  }

  // --- INICIALIZACIÓN ---
  async function init() {
    const snap = await getDocs(collection(db, "resultados"));
    snap.forEach(d => {
      const data = d.data();
      if (data.torneo === "navidad" && data.categoria === "B") {
        R[d.id] = data;
      }
    });
    window.rM = rM;
    rM();
  }
  init();
</script>
</body>
</html>
