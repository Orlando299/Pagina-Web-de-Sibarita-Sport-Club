<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Bolas Criollas - Juego Realista</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:#0d0d0d;font-family:'Segoe UI',Arial,sans-serif;}
    canvas { touch-action: none; }
  </style>
</head>
<body>
  <div style="display:flex;justify-content:center;align-items:center;min-height:100vh;background:#0d0d0d;">
    <canvas id="gameCanvas" width="800" height="400" style="border-radius:12px;box-shadow:0 0 40px rgba(244,208,63,0.2);border:2px solid #f4d03f;"></canvas>
  </div>

  <script>
    // ──────────────────────────────────────────────────────────────────────────
    // CONSTANTES DEL JUEGO
    // ──────────────────────────────────────────────────────────────────────────
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    const W = 800, H = 400;
    const MINGUITO_R = 10;
    const BOLA_R = 14;
    const FRICTION = 0.98;
    const MIN_SPEED = 0.5;
    const MAX_POWER = 22;
    const BALLS_PER_PLAYER = 4;
    
    // Posiciones iniciales
    const ZONA_LANZAMIENTO_P1 = { x: 60, y: H - 50 };
    const ZONA_LANZAMIENTO_P2 = { x: W - 60, y: H - 50 };
    const ZONA_MINGUITO_P1 = { x: W - 80, y: H / 2 };
    const ZONA_MINGUITO_P2 = { x: 80, y: H / 2 };
    
    // Colores
    const COLOR_P1 = "#e63946";
    const COLOR_P2 = "#2ecc71";
    const COLOR_BANCO_P1 = "#c1121f";
    const COLOR_BANCO_P2 = "#27ae60";
    
    // ──────────────────────────────────────────────────────────────────────────
    // UTILIDADES
    // ──────────────────────────────────────────────────────────────────────────
    function dist(a, b) {
      return Math.hypot(a.x - b.x, a.y - b.y);
    }
    
    function clamp(v, min, max) {
      return Math.max(min, Math.min(max, v));
    }
    
    function resolveCollision(a, b) {
      const dx = b.x - a.x, dy = b.y - a.y;
      const d = Math.hypot(dx, dy) || 0.001;
      const overlap = a.r + b.r - d;
      if (overlap <= 0) return;
      const nx = dx / d, ny = dy / d;
      a.x -= nx * overlap / 2;
      a.y -= ny * overlap / 2;
      b.x += nx * overlap / 2;
      b.y += ny * overlap / 2;
      const p = 2 * (a.vx * nx + a.vy * ny - b.vx * nx - b.vy * ny) / 2;
      a.vx -= p * nx;
      a.vy -= p * ny;
      b.vx += p * nx;
      b.vy += p * ny;
      
      // Reducir velocidad por choque (pérdida de energía realista)
      a.vx *= 0.95;
      a.vy *= 0.95;
      b.vx *= 0.95;
      b.vy *= 0.95;
    }
    
    // ──────────────────────────────────────────────────────────────────────────
    // CLASE BOLA
    // ──────────────────────────────────────────────────────────────────────────
    class Bola {
      constructor(owner, index, color, bancoColor) {
        this.owner = owner;      // 1 o 2
        this.index = index;
        this.r = BOLA_R;
        this.color = color;
        this.bancoColor = bancoColor;
        this.played = false;
        this.alive = true;
        this.x = owner === 1 ? 40 + index * (BOLA_R * 2 + 6) : W - 40 - index * (BOLA_R * 2 + 6);
        this.y = owner === 1 ? H - 35 : H - 35;
        this.vx = 0;
        this.vy = 0;
      }
      
      // Posición en el banco (espera)
      setBancoPosition() {
        if (this.played) return;
        this.x = this.owner === 1 ? 40 + this.index * (BOLA_R * 2 + 6) : W - 40 - this.index * (BOLA_R * 2 + 6);
        this.y = H - 35;
      }
      
      // Lanzar desde la zona de lanzamiento
      lanzar(targetX, targetY, power) {
        if (this.played) return false;
        const startX = this.owner === 1 ? ZONA_LANZAMIENTO_P1.x : ZONA_LANZAMIENTO_P2.x;
        const startY = ZONA_LANZAMIENTO_P1.y;
        const dx = targetX - startX;
        const dy = targetY - startY;
        const len = Math.hypot(dx, dy) || 1;
        this.vx = (dx / len) * power;
        this.vy = (dy / len) * power;
        this.x = startX;
        this.y = startY;
        this.played = true;
        this.alive = true;
        return true;
      }
      
      // Boche: lanzar para golpear otra bola
      lanzarBoche(bolaObjetivo, power) {
        if (this.played) return false;
        const startX = this.owner === 1 ? ZONA_LANZAMIENTO_P1.x : ZONA_LANZAMIENTO_P2.x;
        const startY = ZONA_LANZAMIENTO_P1.y;
        const dx = bolaObjetivo.x - startX;
        const dy = bolaObjetivo.y - startY;
        const len = Math.hypot(dx, dy) || 1;
        this.vx = (dx / len) * power;
        this.vy = (dy / len) * power;
        this.x = startX;
        this.y = startY;
        this.played = true;
        this.alive = true;
        return true;
      }
      
      update() {
        if (!this.played || !this.alive) return;
        this.x += this.vx;
        this.y += this.vy;
        this.vx *= FRICTION;
        this.vy *= FRICTION;
        
        // Verificar si está fuera de la cancha (bola muerta)
        if (this.x - this.r < 10 || this.x + this.r > W - 10 || 
            this.y - this.r < 10 || this.y + this.r > H - 10) {
          this.alive = false;
          this.played = false;
        }
        
        if (Math.abs(this.vx) < MIN_SPEED && Math.abs(this.vy) < MIN_SPEED) {
          this.vx = 0;
          this.vy = 0;
        }
      }
      
      draw(ctx) {
        if (!this.played || !this.alive) {
          // Dibujar en el banco
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.r - 2, 0, Math.PI * 2);
          ctx.fillStyle = this.bancoColor;
          ctx.fill();
          ctx.strokeStyle = "#fff";
          ctx.lineWidth = 1;
          ctx.stroke();
          ctx.fillStyle = "#fff";
          ctx.font = `bold ${this.r - 4}px Arial`;
          ctx.textAlign = "center";
          ctx.fillText(this.index + 1, this.x, this.y + 4);
          return;
        }
        
        // Dibujar bola en juego
        const grad = ctx.createRadialGradient(this.x - 4, this.y - 4, 2, this.x, this.y, this.r);
        grad.addColorStop(0, this.color);
        grad.addColorStop(1, this.owner === 1 ? "#a41e2a" : "#1a6e3a");
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
        ctx.fillStyle = grad;
        ctx.fill();
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 1.5;
        ctx.stroke();
        
        // Número de la bola
        ctx.fillStyle = "#fff";
        ctx.font = `bold ${this.r - 2}px Arial`;
        ctx.textAlign = "center";
        ctx.fillText(this.index + 1, this.x, this.y + 5);
      }
    }
    
    // ──────────────────────────────────────────────────────────────────────────
    // CLASE PRINCIPAL DEL JUEGO
    // ──────────────────────────────────────────────────────────────────────────
    class JuegoBolasCriollas {
      constructor() {
        this.minguito = { x: 0, y: 0, r: MINGUITO_R, color: "#f4d03f", colocado: false };
        this.bolasP1 = [];
        this.bolasP2 = [];
        this.turno = 1;  // 1: Jugador Rojo, 2: Jugador Verde
        this.fase = "lanzar_minguito"; // lanzar_minguito, arrime, boche, fin_ronda
        this.modo = "arrime"; // arrime o boche
        this.puntuacion = { 1: 0, 2: 0 };
        this.ronda = 1;
        this.maxRondas = 3;
        this.ganador = null;
        this.mensaje = "🎯 Lanza el minguito al otro extremo!";
        this.aimActive = false;
        this.aimStart = { x: 0, y: 0 };
        this.aimEnd = { x: 0, y: 0 };
        this.bolaSeleccionada = null;
        
        this.initBolas();
        this.resetMinguito();
      }
      
      initBolas() {
        for (let i = 0; i < BALLS_PER_PLAYER; i++) {
          this.bolasP1.push(new Bola(1, i, COLOR_P1, COLOR_BANCO_P1));
          this.bolasP2.push(new Bola(2, i, COLOR_P2, COLOR_BANCO_P2));
        }
      }
      
      resetMinguito() {
        // El minguito se lanza al extremo contrario del jugador que inicia la ronda
        if (this.turno === 1) {
          this.minguito.x = ZONA_MINGUITO_P1.x;
          this.minguito.y = ZONA_MINGUITO_P1.y;
        } else {
          this.minguito.x = ZONA_MINGUITO_P2.x;
          this.minguito.y = ZONA_MINGUITO_P2.y;
        }
        this.minguito.colocado = true;
      }
      
      lanzarMinguito(targetX, targetY, power) {
        const startX = this.turno === 1 ? ZONA_LANZAMIENTO_P1.x : ZONA_LANZAMIENTO_P2.x;
        const startY = ZONA_LANZAMIENTO_P1.y;
        const dx = targetX - startX;
        const dy = targetY - startY;
        const len = Math.hypot(dx, dy) || 1;
        this.minguito.vx = (dx / len) * power;
        this.minguito.vy = (dy / len) * power;
        this.minguito.x = startX;
        this.minguito.y = startY;
        this.fase = "moviendo_minguito";
        this.mensaje = "🏆 Minguito en movimiento...";
      }
      
      updateMinguito() {
        if (!this.minguito.vx && !this.minguito.vy) return true;
        this.minguito.x += this.minguito.vx;
        this.minguito.y += this.minguito.vy;
        this.minguito.vx *= FRICTION;
        this.minguito.vy *= FRICTION;
        
        // Rebote en paredes
        if (this.minguito.x - this.minguito.r < 10) {
          this.minguito.x = 10 + this.minguito.r;
          this.minguito.vx *= -0.5;
        }
        if (this.minguito.x + this.minguito.r > W - 10) {
          this.minguito.x = W - 10 - this.minguito.r;
          this.minguito.vx *= -0.5;
        }
        if (this.minguito.y - this.minguito.r < 10) {
          this.minguito.y = 10 + this.minguito.r;
          this.minguito.vy *= -0.5;
        }
        if (this.minguito.y + this.minguito.r > H - 10) {
          this.minguito.y = H - 10 - this.minguito.r;
          this.minguito.vy *= -0.5;
        }
        
        if (Math.abs(this.minguito.vx) < MIN_SPEED && Math.abs(this.minguito.vy) < MIN_SPEED) {
          this.minguito.vx = 0;
          this.minguito.vy = 0;
          this.fase = "arrime";
          this.modo = "arrime";
          this.mensaje = `🎯 Minguito colocado! Turno del Jugador ${this.turno} - Arrime`;
          return true;
        }
        return false;
      }
      
      getBolasNoJugadas(owner) {
        const bolas = owner === 1 ? this.bolasP1 : this.bolasP2;
        return bolas.filter(b => !b.played);
      }
      
      getBolasJugadas(owner) {
        const bolas = owner === 1 ? this.bolasP1 : this.bolasP2;
        return bolas.filter(b => b.played && b.alive);
      }
      
      // Determinar qué jugador tiene la bola más lejana (debe tirar)
      obtenerJugadorQueDebeTirar() {
        const bolasP1Jugadas = this.getBolasJugadas(1);
        const bolasP2Jugadas = this.getBolasJugadas(2);
        
        if (bolasP1Jugadas.length === 0 && bolasP2Jugadas.length === 0) {
          return this.turno;
        }
        
        if (bolasP1Jugadas.length === 0) return 1;
        if (bolasP2Jugadas.length === 0) return 2;
        
        // Encontrar la bola más cercana al minguito por cada jugador
        const minDist1 = Math.min(...bolasP1Jugadas.map(b => dist(b, this.minguito)));
        const minDist2 = Math.min(...bolasP2Jugadas.map(b => dist(b, this.minguito)));
        
        // El que tiene la bola más lejana tira
        if (minDist1 > minDist2) return 1;
        if (minDist2 > minDist1) return 2;
        return this.turno; // si hay empate, sigue el mismo turno
      }
      
      finalizarRonda() {
        const bolasP1Jugadas = this.getBolasJugadas(1);
        const bolasP2Jugadas = this.getBolasJugadas(2);
        
        if (bolasP1Jugadas.length === 0 || bolasP2Jugadas.length === 0) {
          return false;
        }
        
        const minDist1 = Math.min(...bolasP1Jugadas.map(b => dist(b, this.minguito)));
        const minDist2 = Math.min(...bolasP2Jugadas.map(b => dist(b, this.minguito)));
        
        let ganadorRonda = null;
        if (minDist1 < minDist2) {
          ganadorRonda = 1;
          this.puntuacion[1]++;
          this.mensaje = `🔴 Jugador 1 gana la ronda! (${minDist1.toFixed(0)}px vs ${minDist2.toFixed(0)}px)`;
        } else if (minDist2 < minDist1) {
          ganadorRonda = 2;
          this.puntuacion[2]++;
          this.mensaje = `🟢 Jugador 2 gana la ronda! (${minDist2.toFixed(0)}px vs ${minDist1.toFixed(0)}px)`;
        } else {
          this.mensaje = "🤝 Empate en la ronda!";
        }
        
        if (this.puntuacion[1] >= this.maxRondas || this.puntuacion[2] >= this.maxRondas) {
          this.ganador = this.puntuacion[1] >= this.maxRondas ? 1 : 2;
          this.fase = "fin_juego";
          this.mensaje = `🏆 ¡Jugador ${this.ganador} es el CAMPEÓN! 🏆`;
          return true;
        }
        
        // Preparar siguiente ronda
        this.ronda++;
        this.turno = ganadorRonda || this.turno;
        this.initBolas();
        this.resetMinguito();
        this.fase = "lanzar_minguito";
        this.mensaje = `📢 Ronda ${this.ronda}! El ganador de la ronda anterior lanza el minguito.`;
        return true;
      }
      
      tirarArrime(targetX, targetY, power) {
        const jugador = this.obtenerJugadorQueDebeTirar();
        if (jugador !== this.turno && this.getBolasNoJugadas(this.turno).length > 0) {
          this.mensaje = `⚠️ Debe tirar el Jugador ${this.turno} (tiene la bola más lejana)`;
          return false;
        }
        
        const bolasNoJugadas = this.getBolasNoJugadas(this.turno);
        if (bolasNoJugadas.length === 0) {
          this.finalizarRonda();
          return false;
        }
        
        const bola = bolasNoJugadas[0];
        bola.lanzar(targetX, targetY, clamp(power, 4, MAX_POWER));
        this.mensaje = `🎯 Jugador ${this.turno} lanza bola ${bola.index + 1} al minguito`;
        
        // Cambiar turno si todos los del turno actual ya jugaron
        if (this.getBolasNoJugadas(this.turno).length === 0) {
          this.turno = this.turno === 1 ? 2 : 1;
        } else {
          // Verificar si el otro jugador debe tirar (porque tiene la bola más lejana)
          const siguienteJugador = this.obtenerJugadorQueDebeTirar();
          if (siguienteJugador !== this.turno) {
            this.turno = siguienteJugador;
          }
        }
        
        return true;
      }
      
      tirarBoche(targetBola, power) {
        const bolasNoJugadas = this.getBolasNoJugadas(this.turno);
        if (bolasNoJugadas.length === 0) {
          this.finalizarRonda();
          return false;
        }
        
        const bola = bolasNoJugadas[0];
        bola.lanzarBoche(targetBola, clamp(power, 4, MAX_POWER));
        this.mensaje = `💥 Jugador ${this.turno} hace BOCHE sobre bola ${targetBola.index + 1}`;
        
        if (this.getBolasNoJugadas(this.turno).length === 0) {
          this.turno = this.turno === 1 ? 2 : 1;
        } else {
          const siguienteJugador = this.obtenerJugadorQueDebeTirar();
          if (siguienteJugador !== this.turno) {
            this.turno = siguienteJugador;
          }
        }
        
        return true;
      }
      
      update() {
        if (this.fase === "moviendo_minguito") {
          this.updateMinguito();
          return;
        }
        
        if (this.fase === "fin_juego") return;
        
        // Actualizar todas las bolas
        [...this.bolasP1, ...this.bolasP2].forEach(bola => bola.update());
        
        // Verificar colisiones entre bolas
        const todasBolas = [...this.bolasP1, ...this.bolasP2].filter(b => b.played && b.alive);
        for (let i = 0; i < todasBolas.length; i++) {
          for (let j = i + 1; j < todasBolas.length; j++) {
            if (dist(todasBolas[i], todasBolas[j]) < todasBolas[i].r + todasBolas[j].r) {
              resolveCollision(todasBolas[i], todasBolas[j]);
            }
          }
        }
      }
      
      draw(ctx) {
        // Fondo de cancha
        const grad = ctx.createLinearGradient(0, 0, 0, H);
        grad.addColorStop(0, "#c8a96e");
        grad.addColorStop(1, "#a0784a");
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, W, H);
        
        // Textura de arena
        ctx.fillStyle = "rgba(0,0,0,0.05)";
        for (let i = 0; i < 600; i++) {
          ctx.fillRect(Math.sin(i * 73) * W + W / 2, Math.cos(i * 43) * H + H / 2, 2, 1);
        }
        
        // Bordes de la cancha
        ctx.strokeStyle = "#5a3e1a";
        ctx.lineWidth = 8;
        ctx.strokeRect(8, 8, W - 16, H - 16);
        
        // Línea de lanzamiento
        ctx.beginPath();
        ctx.moveTo(40, H - 50);
        ctx.lineTo(80, H - 50);
        ctx.strokeStyle = "#f4d03f";
        ctx.lineWidth = 3;
        ctx.stroke();
        
        ctx.beginPath();
        ctx.moveTo(W - 40, H - 50);
        ctx.lineTo(W - 80, H - 50);
        ctx.stroke();
        
        // Minguito
        if (this.minguito.colocado) {
          ctx.beginPath();
          ctx.arc(this.minguito.x, this.minguito.y, MINGUITO_R, 0, Math.PI * 2);
          ctx.fillStyle = "#f4d03f";
          ctx.fill();
          ctx.strokeStyle = "#c8860a";
          ctx.lineWidth = 2;
          ctx.stroke();
          ctx.fillStyle = "#7a5c00";
          ctx.font = "bold 10px Arial";
          ctx.textAlign = "center";
          ctx.fillText("M", this.minguito.x, this.minguito.y + 4);
        }
        
        // Zona de lanzamiento actual
        if (this.fase === "arrime" && this.aimActive) {
          const startX = this.turno === 1 ? ZONA_LANZAMIENTO_P1.x : ZONA_LANZAMIENTO_P2.x;
          const startY = ZONA_LANZAMIENTO_P1.y;
          ctx.setLineDash([6, 6]);
          ctx.beginPath();
          ctx.moveTo(startX, startY);
          ctx.lineTo(this.aimEnd.x, this.aimEnd.y);
          ctx.strokeStyle = this.turno === 1 ? "#e63946" : "#2ecc71";
          ctx.lineWidth = 2;
          ctx.stroke();
          ctx.setLineDash([]);
          
          const dx = this.aimEnd.x - startX;
          const dy = this.aimEnd.y - startY;
          const len = Math.hypot(dx, dy);
          const power = Math.min(len / 2.5, MAX_POWER);
          const pct = power / MAX_POWER;
          const barW = 100;
          const barX = startX - barW / 2;
          const barY = startY + 25;
          ctx.fillStyle = "rgba(0,0,0,0.5)";
          ctx.fillRect(barX, barY, barW, 8);
          ctx.fillStyle = pct < 0.4 ? "#2ecc71" : pct < 0.7 ? "#f39c12" : "#e74c3c";
          ctx.fillRect(barX + 1, barY + 1, (barW - 2) * pct, 6);
        }
        
        // Dibujar bolas
        this.bolasP1.forEach(bola => bola.draw(ctx));
        this.bolasP2.forEach(bola => bola.draw(ctx));
        
        // Distancias
        if (this.minguito.colocado && (this.fase === "arrime" || this.fase === "boche")) {
          const jugadas = [...this.getBolasJugadas(1), ...this.getBolasJugadas(2)];
          jugadas.forEach(bola => {
            const d = dist(bola, this.minguito);
            ctx.fillStyle = bola.owner === 1 ? "#e63946aa" : "#2ecc71aa";
            ctx.font = "bold 10px Arial";
            ctx.fillText(`${Math.round(d)}px`, (bola.x + this.minguito.x) / 2, (bola.y + this.minguito.y) / 2 - 5);
          });
        }
        
        // Texto de turno y fase
        ctx.font = "bold 12px Arial";
        ctx.fillStyle = "#fff";
        ctx.shadowBlur = 4;
        ctx.shadowColor = "#000";
        
        if (this.fase === "arrime") {
          ctx.fillText(`🎯 Turno: Jugador ${this.turno} (${this.turno === 1 ? "ROJO" : "VERDE"})`, 15, 25);
          ctx.fillText(`📊 Modo: ARRIME - Acércate al minguito`, 15, 45);
        } else if (this.fase === "lanzar_minguito") {
          ctx.fillText(`🎯 Ronda ${this.ronda} - Jugador ${this.turno} lanza el MINGUITO`, 15, 25);
        }
        
        ctx.fillText(`🏆 Puntos: ${this.puntuacion[1]} - ${this.puntuacion[2]}`, W - 120, 25);
        ctx.fillText(`⚾ Bolas restantes: P1: ${this.getBolasNoJugadas(1).length} | P2: ${this.getBolasNoJugadas(2).length}`, W - 200, 45);
        
        // Mensaje
        ctx.font = "italic 12px Arial";
        ctx.fillStyle = "#f4d03f";
        ctx.fillText(this.mensaje, 15, H - 15);
        
        ctx.shadowBlur = 0;
        
        // Fin del juego
        if (this.ganador) {
          ctx.fillStyle = "rgba(0,0,0,0.8)";
          ctx.fillRect(0, 0, W, H);
          ctx.font = "bold 28px Arial";
          ctx.fillStyle = "#f4d03f";
          ctx.textAlign = "center";
          ctx.fillText(`🏆 JUGADOR ${this.ganador} CAMPEÓN 🏆`, W / 2, H / 2 - 20);
          ctx.font = "16px Arial";
          ctx.fillStyle = "#fff";
          ctx.fillText(`Puntuación final: ${this.puntuacion[1]} - ${this.puntuacion[2]}`, W / 2, H / 2 + 20);
          ctx.fillStyle = "#ccc";
          ctx.font = "12px Arial";
          ctx.fillText("Recarga la página para jugar de nuevo", W / 2, H / 2 + 55);
          ctx.textAlign = "left";
        }
      }
      
      manejarClick(x, y) {
        if (this.ganador) return;
        
        if (this.fase === "lanzar_minguito") {
          // Lanzar minguito con potencia fija
          this.lanzarMinguito(x, y, 14);
          return;
        }
        
        if (this.fase === "arrime") {
          // Mostrar línea de apuntado
          this.aimActive = true;
          this.aimStart = { x: this.turno === 1 ? ZONA_LANZAMIENTO_P1.x : ZONA_LANZAMIENTO_P2.x, y: ZONA_LANZAMIENTO_P1.y };
          this.aimEnd = { x: x, y: y };
        }
      }
      
      manejarMove(x, y) {
        if (this.fase === "arrime" && this.aimActive) {
          this.aimEnd = { x: x, y: y };
        }
      }
      
      manejarRelease(x, y) {
        if (this.fase === "arrime" && this.aimActive) {
          this.aimActive = false;
          const dx = x - this.aimStart.x;
          const dy = y - this.aimStart.y;
          const len = Math.hypot(dx, dy);
          const power = Math.min(len / 2.5, MAX_POWER);
          this.tirarArrime(x, y, power);
        }
      }
    }
    
    // ──────────────────────────────────────────────────────────────────────────
    // INICIALIZACIÓN
    // ──────────────────────────────────────────────────────────────────────────
    const juego = new JuegoBolasCriollas();
    
    let animFrame;
    let touchStart = false;
    
    function getCanvasCoords(e) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      let clientX, clientY;
      if (e.touches) {
        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY;
      } else {
        clientX = e.clientX;
        clientY = e.clientY;
      }
      let x = (clientX - rect.left) * scaleX;
      let y = (clientY - rect.top) * scaleY;
      x = clamp(x, 10, W - 10);
      y = clamp(y, 10, H - 10);
      return { x, y };
    }
    
    function onPointerDown(e) {
      e.preventDefault();
      const { x, y } = getCanvasCoords(e);
      juego.manejarClick(x, y);
    }
    
    function onPointerMove(e) {
      e.preventDefault();
      const { x, y } = getCanvasCoords(e);
      juego.manejarMove(x, y);
    }
    
    function onPointerUp(e) {
      e.preventDefault();
      const { x, y } = getCanvasCoords(e);
      juego.manejarRelease(x, y);
    }
    
    canvas.addEventListener('mousedown', onPointerDown);
    canvas.addEventListener('mousemove', onPointerMove);
    canvas.addEventListener('mouseup', onPointerUp);
    canvas.addEventListener('touchstart', onPointerDown);
    canvas.addEventListener('touchmove', onPointerMove);
    canvas.addEventListener('touchend', onPointerUp);
    
    function animate() {
      juego.update();
      juego.draw(ctx);
      animFrame = requestAnimationFrame(animate);
    }
    
    animate();
  </script>
</body>
</html>
