<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Bolas Criollas - Lanzamiento desde el centro</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;user-select:none;}
    body{background:#0a0a0a;min-height:100vh;display:flex;justify-content:center;align-items:center;font-family:'Segoe UI',Arial,sans-serif;}
    .game-container{background:#1a1a2e;border-radius:24px;padding:20px;box-shadow:0 20px 40px rgba(0,0,0,0.5);}
    canvas{display:block;margin:0 auto;border-radius:16px;box-shadow:0 0 20px rgba(244,208,63,0.3);cursor:crosshair;touch-action:none;}
    .info-panel{display:flex;justify-content:space-between;align-items:center;gap:40px;margin-bottom:20px;padding:15px 30px;background:rgba(0,0,0,0.6);border-radius:60px;backdrop-filter:blur(10px);}
    .player{text-align:center;padding:8px 30px;border-radius:40px;transition:all 0.3s;}
    .player.red{background:linear-gradient(135deg,rgba(230,57,70,0.2),rgba(230,57,70,0.05));border:1px solid #e63946;}
    .player.green{background:linear-gradient(135deg,rgba(46,204,113,0.2),rgba(46,204,113,0.05));border:1px solid #2ecc71;}
    .player.active{transform:scale(1.05);box-shadow:0 0 20px currentColor;}
    .player.red.active{border-color:#e63946;box-shadow:0 0 15px #e63946;}
    .player.green.active{border-color:#2ecc71;box-shadow:0 0 15px #2ecc71;}
    .score{font-size:42px;font-weight:bold;line-height:1;}
    .player.red .score{color:#e63946;}
    .player.green .score{color:#2ecc71;}
    .player-name{font-size:14px;letter-spacing:2px;margin-top:5px;}
    .round-box{text-align:center;background:rgba(244,208,63,0.15);padding:8px 20px;border-radius:40px;border:1px solid #f4d03f;}
    .round-label{font-size:10px;color:#f4d03f;letter-spacing:2px;}
    .round-number{font-size:28px;font-weight:bold;color:#f4d03f;}
    button{background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);padding:8px 20px;border-radius:30px;color:white;font-weight:bold;cursor:pointer;transition:all 0.2s;margin:0 5px;}
    button:active{transform:scale(0.95);}
    .controls{display:flex;gap:10px;justify-content:center;margin-top:15px;}
    .toast{position:fixed;bottom:30px;right:30px;background:#f4d03f;color:#1a0a00;padding:12px 24px;border-radius:40px;font-weight:bold;animation:slideIn 0.3s ease;z-index:1000;}
    @keyframes slideIn{from{transform:translateX(100%);opacity:0;}to{transform:translateX(0);opacity:1;}}
  </style>
</head>
<body>
<div>
  <div class="game-container">
    <div class="info-panel">
      <div class="player red" id="playerRed">
        <div class="score" id="scoreRed">0</div>
        <div class="player-name">🔴 ROJO</div>
      </div>
      <div class="round-box">
        <div class="round-label">RONDA</div>
        <div class="round-number" id="roundNum">1/3</div>
      </div>
      <div class="player green" id="playerGreen">
        <div class="score" id="scoreGreen">0</div>
        <div class="player-name">🟢 VERDE</div>
      </div>
    </div>
    
    <canvas id="gameCanvas" width="400" height="500" style="width:100%;max-width:400px;height:auto"></canvas>
    
    <div class="controls">
      <button id="resetBtn">🔄 REINICIAR</button>
      <button id="modeBtn">👥 2 JUGADORES</button>
    </div>
  </div>
  <div id="toast" class="toast" style="display:none"></div>
</div>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const W = 400, H = 500;
  canvas.width = W;
  canvas.height = H;
  
  // Constantes ajustadas para nueva escala
  const MINGO_R = 8;
  const BOLA_R = 12;
  const FRICTION = 0.985;
  const MIN_SPEED = 0.5;
  const MAX_POWER = 14;
  const BALLS_PER_PLAYER = 4;
  const WALL_PENALTY = 22;
  const BOCHE_DIST = 30;
  const CENTER_X = W / 2;
  const LAUNCH_Y = H - 45;
  
  const NULL_BALL_X = -60;
  const NULL_BALL_Y = -60;
  
  const RED_COLORS = ['#e63946', '#c1121f', '#ff6b6b', '#ff9a9e'];
  const GREEN_COLORS = ['#2ecc71', '#27ae60', '#58d68d', '#82e0aa'];
  
  let mingo = { x: W/2, y: H/3, vx: 0, vy: 0 };
  let balls = [];
  let currentTurn = 1;
  let scores = {1: 0, 2: 0};
  let currentRound = 1;
  const MAX_ROUNDS = 3;
  let mingoPlanted = false;
  let gamePhase = 'aim';
  let gameWinner = null;
  let isIA = false;
  let primeraRondaActiva = true;
  
  let dragging = false;
  let dragStart = { x: 0, y: 0 };
  let dragEnd = { x: 0, y: 0 };
  let animFrame = null;
  let particles = [];
  let impactWaves = [];
  
  let currentBallInHand = null;
  
  function mostrarMensaje(msg, error = false) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.style.background = error ? '#e74c3c' : '#f4d03f';
    toast.style.display = 'block';
    setTimeout(() => toast.style.display = 'none', 2500);
  }
  
  function actualizarUI() {
    document.getElementById('scoreRed').textContent = scores[1];
    document.getElementById('scoreGreen').textContent = scores[2];
    document.getElementById('roundNum').textContent = `${currentRound}/${MAX_ROUNDS}`;
    
    const redDiv = document.getElementById('playerRed');
    const greenDiv = document.getElementById('playerGreen');
    
    if (gamePhase === 'aim' && !gameWinner) {
      if (currentTurn === 1) {
        redDiv.classList.add('active');
        greenDiv.classList.remove('active');
      } else {
        greenDiv.classList.add('active');
        redDiv.classList.remove('active');
      }
    } else {
      redDiv.classList.remove('active');
      greenDiv.classList.remove('active');
    }
  }
  
  function distancia(a, b) {
    return Math.hypot(a.x - b.x, a.y - b.y);
  }
  
  function clamp(v, min, max) {
    return Math.max(min, Math.min(max, v));
  }
  
  function verificarPared(bola) {
    return (bola.x - bola.r < WALL_PENALTY || 
            bola.x + bola.r > W - WALL_PENALTY ||
            bola.y - bola.r < WALL_PENALTY || 
            bola.y + bola.r > H - WALL_PENALTY);
  }
  
  function anularBola(bola, motivo = '') {
    bola.wallHit = true;
    bola.played = true;
    bola.x = NULL_BALL_X;
    bola.y = NULL_BALL_Y;
    bola.vx = 0;
    bola.vy = 0;
    mostrarMensaje(`⚠️ Bola ${bola.owner === 1 ? 'Roja' : 'Verde'} ANULADA`, true);
  }
  
  function anularMingo() {
    mingoPlanted = false;
    gamePhase = 'end';
    mostrarMensaje('💀 ¡MINGO ANULADO! Tocó la pared. Reiniciando partida...', true);
    setTimeout(() => {
      resetGame();
    }, 2000);
  }
  
  function addParticles(x, y, color) {
    for (let i = 0; i < 5; i++) {
      particles.push({
        x: x, y: y,
        vx: (Math.random() - 0.5) * 4,
        vy: (Math.random() - 0.5) * 4,
        life: 1,
        color: color
      });
    }
  }
  
  function updateParticles() {
    for (let i = particles.length-1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.life -= 0.05;
      if (p.life <= 0) particles.splice(i,1);
    }
  }
  
  function addImpactWave(x, y) {
    impactWaves.push({ x: x, y: y, radius: 3, life: 0.8 });
  }
  
  function updateImpactWaves() {
    for (let i = impactWaves.length-1; i >= 0; i--) {
      const w = impactWaves[i];
      w.radius += 3;
      w.life -= 0.05;
      if (w.life <= 0) impactWaves.splice(i,1);
    }
  }
  
  function obtenerJugadorGanando() {
    const bolasValidas = balls.filter(b => b.played && !b.wallHit && b.x > 0);
    if (bolasValidas.length === 0) return null;
    
    let mejorDistRoja = Infinity, mejorDistVerde = Infinity;
    bolasValidas.forEach(b => {
      const d = distancia(b, mingo);
      if (b.owner === 1 && d < mejorDistRoja) mejorDistRoja = d;
      if (b.owner === 2 && d < mejorDistVerde) mejorDistVerde = d;
    });
    
    if (mejorDistRoja === Infinity && mejorDistVerde === Infinity) return null;
    if (mejorDistRoja === Infinity) return 2;
    if (mejorDistVerde === Infinity) return 1;
    if (mejorDistRoja < mejorDistVerde) return 1;
    if (mejorDistVerde < mejorDistRoja) return 2;
    return null;
  }
  
  function obtenerQuienDebeTirar() {
    if (!mingoPlanted) return currentTurn;
    
    const bolasValidas = balls.filter(b => b.played && !b.wallHit && b.x > 0);
    const rojasJugadas = bolasValidas.filter(b => b.owner === 1).length;
    const verdesJugadas = bolasValidas.filter(b => b.owner === 2).length;
    const rojasRestantes = balls.filter(b => b.owner === 1 && !b.played).length;
    const verdesRestantes = balls.filter(b => b.owner === 2 && !b.played).length;
    
    if (primeraRondaActiva) {
      if (rojasJugadas === 0) return 1;
      if (rojasJugadas > 0 && verdesJugadas === 0) return 2;
      if (rojasJugadas >= 1 && verdesJugadas >= 1) {
        primeraRondaActiva = false;
        mostrarMensaje('📢 Fin de primera ronda. Ahora juega el que VA PERDIENDO');
      }
    }
    
    if (rojasRestantes === 0 && verdesRestantes > 0) return 2;
    if (verdesRestantes === 0 && rojasRestantes > 0) return 1;
    
    if (!primeraRondaActiva && rojasRestantes > 0 && verdesRestantes > 0) {
      const jugadorGanando = obtenerJugadorGanando();
      if (jugadorGanando !== null) return jugadorGanando === 1 ? 2 : 1;
    }
    return currentTurn;
  }
  
  function aplicarBoche(bolaObjetivo, bolaOrigen) {
    const angulo = Math.atan2(bolaObjetivo.y - bolaOrigen.y, bolaObjetivo.x - bolaOrigen.x);
    bolaObjetivo.x += Math.cos(angulo) * BOCHE_DIST;
    bolaObjetivo.y += Math.sin(angulo) * BOCHE_DIST;
    bolaObjetivo.x = clamp(bolaObjetivo.x, BOLA_R + 10, W - BOLA_R - 10);
    bolaObjetivo.y = clamp(bolaObjetivo.y, BOLA_R + 10, H - BOLA_R - 10);
    addImpactWave(bolaObjetivo.x, bolaObjetivo.y);
    addParticles(bolaObjetivo.x, bolaObjetivo.y, '#f4d03f');
    if (verificarPared(bolaObjetivo)) anularBola(bolaObjetivo, 'Boche contra pared');
  }
  
  function resolverColision(a, b) {
    const dx = b.x - a.x, dy = b.y - a.y;
    const d = Math.hypot(dx, dy);
    if (d === 0) return;
    const overlap = (a.r + b.r) - d;
    if (overlap <= 0) return;
    const nx = dx / d, ny = dy / d;
    a.x -= nx * overlap / 2;
    a.y -= ny * overlap / 2;
    b.x += nx * overlap / 2;
    b.y += ny * overlap / 2;
    const vrelx = b.vx - a.vx, vrely = b.vy - a.vy;
    const dot = vrelx * nx + vrely * ny;
    if (dot < 0) {
      const e = 0.7;
      const imp = (1 + e) * dot / 2;
      a.vx += imp * nx;
      a.vy += imp * ny;
      b.vx -= imp * nx;
      b.vy -= imp * ny;
    }
  }
  
  function iniciarJuego() {
    mingo = { x: W/2, y: H/3, vx: 0, vy: 0 };
    balls = [];
    for (let i = 0; i < BALLS_PER_PLAYER; i++) {
      balls.push({
        id: `r${i}`, owner: 1, r: BOLA_R,
        x: NULL_BALL_X, y: NULL_BALL_Y,
        vx: 0, vy: 0, color: RED_COLORS[i],
        played: false, wallHit: false, boched: false,
        numero: i + 1
      });
    }
    for (let i = 0; i < BALLS_PER_PLAYER; i++) {
      balls.push({
        id: `g${i}`, owner: 2, r: BOLA_R,
        x: NULL_BALL_X, y: NULL_BALL_Y,
        vx: 0, vy: 0, color: GREEN_COLORS[i],
        played: false, wallHit: false, boched: false,
        numero: i + 1
      });
    }
    currentTurn = 1;
    mingoPlanted = false;
    gamePhase = 'aim';
    gameWinner = null;
    primeraRondaActiva = true;
    particles = [];
    impactWaves = [];
    currentBallInHand = null;
    actualizarUI();
    dibujar();
    mostrarMensaje('🖐️ Arrastra para COLOCAR el MINGO donde quieras');
  }
  
  function colocarMingo(posX, posY) {
    let newX = posX;
    let newY = posY;
    newX = clamp(newX, WALL_PENALTY + MINGO_R, W - WALL_PENALTY - MINGO_R);
    newY = clamp(newY, WALL_PENALTY + MINGO_R, H - WALL_PENALTY - MINGO_R);
    mingo.x = newX;
    mingo.y = newY;
    mingo.vx = 0;
    mingo.vy = 0;
    mingoPlanted = true;
    gamePhase = 'aim';
    actualizarBolaEnMano();
    mostrarMensaje('🎯 Mingo colocado. ¡Arrastra para lanzar tus bolas!');
    actualizarUI();
    dibujar();
  }
  
  function actualizarBolaEnMano() {
    const bolasRestantes = balls.filter(b => b.owner === currentTurn && !b.played);
    if (bolasRestantes.length > 0) {
      currentBallInHand = bolasRestantes[0];
      currentBallInHand.x = CENTER_X;
      currentBallInHand.y = LAUNCH_Y;
    } else {
      currentBallInHand = null;
    }
  }
  
  function finTurno() {
    const ultimaBola = balls.filter(b => b.played && !b.wallHit && b.x > 0).pop();
    if (ultimaBola && verificarPared(ultimaBola)) anularBola(ultimaBola, 'Tocó la pared');
    const sinJugar = balls.filter(b => !b.played);
    
    if (sinJugar.length > 0) {
      const quienDebeTirar = obtenerQuienDebeTirar();
      if (quienDebeTirar !== currentTurn) {
        currentTurn = quienDebeTirar;
        actualizarBolaEnMano();
      }
      mostrarMensaje(currentTurn === 1 ? '🔴 Turno del ROJO' : '🟢 Turno del VERDE');
      gamePhase = 'aim';
      actualizarUI();
      dibujar();
      if (isIA && currentTurn === 2 && gamePhase === 'aim') setTimeout(() => iaLanzar(), 500);
      return;
    }
    
    const bolasValidas = balls.filter(b => b.played && !b.wallHit && b.x > 0);
    let mejorDistRoja = Infinity, mejorDistVerde = Infinity;
    bolasValidas.forEach(b => {
      const d = distancia(b, mingo);
      if (b.owner === 1 && d < mejorDistRoja) mejorDistRoja = d;
      if (b.owner === 2 && d < mejorDistVerde) mejorDistVerde = d;
    });
    
    let ganadorRonda = null;
    if (mejorDistRoja < mejorDistVerde && mejorDistRoja !== Infinity) {
      ganadorRonda = 1;
      const puntos = bolasValidas.filter(b => b.owner === 1 && distancia(b, mingo) < mejorDistVerde).length;
      scores[1] += puntos;
      mostrarMensaje(`✅ Ronda ${currentRound}: Rojo gana +${puntos}`);
    } else if (mejorDistVerde < mejorDistRoja && mejorDistVerde !== Infinity) {
      ganadorRonda = 2;
      const puntos = bolasValidas.filter(b => b.owner === 2 && distancia(b, mingo) < mejorDistRoja).length;
      scores[2] += puntos;
      mostrarMensaje(`✅ Ronda ${currentRound}: Verde gana +${puntos}`);
    } else mostrarMensaje(`🤝 Ronda ${currentRound}: Empate`);
    
    actualizarUI();
    
    if (currentRound >= MAX_ROUNDS) {
      gameWinner = scores[1] > scores[2] ? 1 : scores[2] > scores[1] ? 2 : 0;
      gamePhase = 'end';
      mostrarMensaje(gameWinner === 0 ? '¡EMPATE!' : `🏆 ${gameWinner === 1 ? 'ROJO' : 'VERDE'} GANA!`);
      actualizarUI();
      dibujar();
      return;
    }
    
    currentRound++;
    const nuevasBolas = [];
    for (let i = 0; i < BALLS_PER_PLAYER; i++) {
      nuevasBolas.push({
        id: `r${i}`, owner: 1, r: BOLA_R,
        x: NULL_BALL_X, y: NULL_BALL_Y,
        vx: 0, vy: 0, color: RED_COLORS[i],
        played: false, wallHit: false, boched: false,
        numero: i + 1
      });
    }
    for (let i = 0; i < BALLS_PER_PLAYER; i++) {
      nuevasBolas.push({
        id: `g${i}`, owner: 2, r: BOLA_R,
        x: NULL_BALL_X, y: NULL_BALL_Y,
        vx: 0, vy: 0, color: GREEN_COLORS[i],
        played: false, wallHit: false, boched: false,
        numero: i + 1
      });
    }
    balls = nuevasBolas;
    mingo = { x: W/2, y: H/3, vx: 0, vy: 0 };
    mingoPlanted = false;
    currentTurn = ganadorRonda || 1;
    gamePhase = 'aim';
    primeraRondaActiva = true;
    currentBallInHand = null;
    actualizarUI();
    mostrarMensaje(`🎲 RONDA ${currentRound} - Coloca el MINGO`);
    dibujar();
  }
  
  function actualizarFisica() {
    if (gamePhase !== 'rolling') return;
    
    let moviendo = false;
    const objetos = [];
    if (mingo.vx !== 0 || mingo.vy !== 0) objetos.push(mingo);
    balls.forEach(b => { if (b.played && !b.wallHit && (b.vx !== 0 || b.vy !== 0)) objetos.push(b); });
    
    objetos.forEach(o => {
      o.x += o.vx;
      o.y += o.vy;
      o.vx *= FRICTION;
      o.vy *= FRICTION;
      
      if (o !== mingo && verificarPared(o)) {
        anularBola(o, 'Tocó la pared');
        return;
      }
      
      if (o === mingo && verificarPared(o)) {
        anularMingo();
        return;
      }
      
      if (Math.abs(o.vx) < MIN_SPEED) o.vx = 0;
      if (Math.abs(o.vy) < MIN_SPEED) o.vy = 0;
      if (o.vx !== 0 || o.vy !== 0) moviendo = true;
    });
    
    const bolasJugadas = balls.filter(b => b.played && !b.wallHit);
    
    for (let i = 0; i < bolasJugadas.length; i++) {
      for (let j = i + 1; j < bolasJugadas.length; j++) {
        const bolaA = bolasJugadas[i];
        const bolaB = bolasJugadas[j];
        if (bolaA.owner === bolaB.owner && distancia(bolaA, bolaB) < bolaA.r + bolaB.r) {
          resolverColision(bolaA, bolaB);
        }
      }
    }
    
    for (let i = 0; i < bolasJugadas.length; i++) {
      for (let j = i + 1; j < bolasJugadas.length; j++) {
        const bolaA = bolasJugadas[i];
        const bolaB = bolasJugadas[j];
        if (bolaA.owner !== bolaB.owner && distancia(bolaA, bolaB) < bolaA.r + bolaB.r) {
          const velA = Math.abs(bolaA.vx) + Math.abs(bolaA.vy);
          const velB = Math.abs(bolaB.vx) + Math.abs(bolaB.vy);
          if (velA < velB) {
            aplicarBoche(bolaA, bolaB);
            mostrarMensaje(`💥 BOCHE! Bola ${bolaA.owner === 1 ? 'Roja' : 'Verde'}`);
          } else {
            aplicarBoche(bolaB, bolaA);
            mostrarMensaje(`💥 BOCHE! Bola ${bolaB.owner === 1 ? 'Roja' : 'Verde'}`);
          }
        }
      }
    }
    
    for (let i = 0; i < bolasJugadas.length; i++) {
      const bola = bolasJugadas[i];
      if (distancia(bola, mingo) < bola.r + mingo.r) {
        resolverColision(bola, mingo);
      }
    }
    
    updateParticles();
    updateImpactWaves();
    if (!moviendo && objetos.length > 0) finTurno();
    dibujar();
  }
  
  function lanzarBola(fromX, fromY, toX, toY) {
    if (!currentBallInHand) {
      actualizarBolaEnMano();
      if (!currentBallInHand) {
        mostrarMensaje('⚠️ No te quedan bolas', true);
        return;
      }
    }
    
    const bola = currentBallInHand;
    const idx = bola.numero - 1;
    
    bola.x = CENTER_X;
    bola.y = LAUNCH_Y;
    
    const dx = toX - fromX;
    const dy = toY - fromY;
    const len = Math.hypot(dx, dy);
    if (len === 0) return;
    const power = Math.min(len / 2.5, MAX_POWER);
    bola.vx = (dx / len) * power;
    bola.vy = (dy / len) * power;
    bola.played = true;
    bola.boched = false;
    
    currentBallInHand = null;
    gamePhase = 'rolling';
    addParticles(bola.x, bola.y, bola.color);
    actualizarUI();
    mostrarMensaje(`🎳 ${currentTurn === 1 ? 'Rojo' : 'Verde'} lanzó bola ${idx+1}`);
  }
  
  function iaLanzar() {
    if (gamePhase !== 'aim' || currentTurn !== 2) return;
    if (!currentBallInHand) actualizarBolaEnMano();
    if (!currentBallInHand) return;
    
    const bola = currentBallInHand;
    const idx = bola.numero - 1;
    const startX = CENTER_X;
    const startY = LAUNCH_Y;
    
    let targetX = mingo.x + (Math.random() - 0.5) * 50;
    let targetY = mingo.y + (Math.random() - 0.5) * 50;
    targetX = clamp(targetX, 40, W-40);
    targetY = clamp(targetY, 50, H-50);
    
    const dx = targetX - startX;
    const dy = targetY - startY;
    const len = Math.hypot(dx, dy);
    const power = Math.min(len / 2.5, MAX_POWER);
    
    bola.x = startX;
    bola.y = startY;
    bola.vx = (dx / len) * power;
    bola.vy = (dy / len) * power;
    bola.played = true;
    bola.boched = false;
    
    currentBallInHand = null;
    gamePhase = 'rolling';
    addParticles(bola.x, bola.y, bola.color);
    actualizarUI();
    mostrarMensaje('🤖 IA lanzando...');
  }
  
  function drawParticles() {
    particles.forEach(p => {
      ctx.globalAlpha = p.life;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 2, 0, Math.PI*2);
      ctx.fillStyle = p.color;
      ctx.fill();
      ctx.globalAlpha = 1;
    });
  }
  
  function drawImpactWaves() {
    impactWaves.forEach(w => {
      ctx.globalAlpha = w.life;
      ctx.beginPath();
      ctx.arc(w.x, w.y, w.radius, 0, Math.PI*2);
      ctx.strokeStyle = '#f4d03f';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.globalAlpha = 1;
    });
  }
  
  function dibujar() {
    ctx.clearRect(0, 0, W, H);
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#8B6914');
    grad.addColorStop(1, '#C4A35A');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
    
    ctx.strokeStyle = 'rgba(255,255,255,0.1)';
    ctx.lineWidth = 1;
    for (let i = 0; i < H; i += 30) {
      ctx.beginPath();
      ctx.moveTo(0, i);
      ctx.lineTo(W, i);
      ctx.stroke();
    }
    
    ctx.strokeStyle = '#ff0000aa';
    ctx.setLineDash([5,5]);
    ctx.strokeRect(WALL_PENALTY, WALL_PENALTY, W - WALL_PENALTY*2, H - WALL_PENALTY*2);
    ctx.setLineDash([]);
    
    ctx.strokeStyle = '#5C4010';
    ctx.lineWidth = 6;
    ctx.strokeRect(3,3,W-6,H-6);
    ctx.strokeStyle = '#D4B05A';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(6,6,W-12,H-12);
    
    ctx.beginPath();
    ctx.moveTo(W/2,10);
    ctx.lineTo(W/2,H-10);
    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.setLineDash([8,8]);
    ctx.stroke();
    ctx.setLineDash([]);
    
    if (mingoPlanted) {
      [25,45,70].forEach((r,i) => {
        ctx.beginPath();
        ctx.arc(mingo.x, mingo.y, r, 0, Math.PI*2);
        ctx.strokeStyle = `rgba(244,208,63,${0.3 - i*0.08})`;
        ctx.stroke();
      });
    }
    
    if (mingoPlanted) {
      ctx.beginPath();
      ctx.arc(mingo.x, mingo.y, MINGO_R, 0, Math.PI*2);
      ctx.fillStyle = '#f4d03f';
      ctx.fill();
      ctx.fillStyle = '#d4a017';
      ctx.font = 'bold 10px serif';
      ctx.textAlign = 'center';
      ctx.fillText('⚜️', mingo.x, mingo.y+3);
    } else if (!mingoPlanted && gamePhase === 'aim') {
      ctx.font = 'bold 10px sans-serif';
      ctx.fillStyle = 'rgba(244,208,63,0.8)';
      ctx.fillText('🖐️ ARRASTRA PARA COLOCAR EL MINGO', W/2, H/2-40);
    }
    
    balls.forEach(b => {
      if (!b.played || b.x < 0) return;
      if (b.wallHit) {
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r + 1.5, 0, Math.PI*2);
        ctx.strokeStyle = '#ff0000';
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.fillStyle = '#ff0000';
        ctx.font = 'bold 8px sans-serif';
        ctx.fillText('✘', b.x-3, b.y-8);
      }
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, Math.PI*2);
      ctx.fillStyle = b.color;
      ctx.fill();
      ctx.fillStyle = 'white';
      ctx.font = `bold ${b.r*0.7}px serif`;
      ctx.fillText(b.numero, b.x, b.y+4);
    });
    
    drawParticles();
    drawImpactWaves();
    
    if (currentBallInHand && mingoPlanted && gamePhase === 'aim' && !dragging) {
      const manoX = CENTER_X;
      const manoY = LAUNCH_Y;
      
      ctx.beginPath();
      ctx.ellipse(manoX, manoY, 12, 16, 0, 0, Math.PI*2);
      ctx.fillStyle = '#f5cba0';
      ctx.fill();
      ctx.strokeStyle = '#d4a373';
      ctx.lineWidth = 1;
      ctx.stroke();
      
      ctx.beginPath();
      ctx.arc(manoX, manoY - 5, BOLA_R - 2, 0, Math.PI*2);
      ctx.fillStyle = currentBallInHand.color;
      ctx.fill();
      ctx.fillStyle = 'white';
      ctx.font = `bold ${(BOLA_R-4)*0.7}px serif`;
      ctx.fillText(currentBallInHand.numero, manoX, manoY - 3);
      
      ctx.fillStyle = '#e8b84b';
      ctx.font = 'bold 8px sans-serif';
      ctx.fillText(`👆 ${currentTurn === 1 ? 'ROJO' : 'VERDE'}`, manoX, manoY - 18);
    }
    
    if (dragging && gamePhase === 'aim') {
      const dx = dragEnd.x - dragStart.x, dy = dragEnd.y - dragStart.y;
      const len = Math.hypot(dx, dy);
      const power = Math.min(len/2.5, MAX_POWER);
      const nx = dx/(len||1), ny = dy/(len||1);
      
      ctx.save();
      ctx.shadowBlur = 0;
      const manoX = dragStart.x, manoY = dragStart.y;
      ctx.beginPath();
      ctx.ellipse(manoX, manoY, 12, 16, 0, 0, Math.PI*2);
      ctx.fillStyle = '#f5cba0';
      ctx.fill();
      ctx.strokeStyle = '#d4a373';
      ctx.lineWidth = 1;
      ctx.stroke();
      
      const puntaX = manoX + nx * 20, puntaY = manoY + ny * 20;
      ctx.beginPath();
      ctx.moveTo(manoX + nx * 6, manoY + ny * 6);
      ctx.lineTo(puntaX, puntaY);
      ctx.lineTo(manoX + nx * 6 + ny * 5, manoY + ny * 6 - nx * 5);
      ctx.fillStyle = '#f5cba0';
      ctx.fill();
      
      if (currentBallInHand) {
        ctx.beginPath();
        ctx.arc(manoX, manoY - 5, BOLA_R - 2, 0, Math.PI*2);
        ctx.fillStyle = currentBallInHand.color;
        ctx.fill();
        ctx.fillStyle = 'white';
        ctx.font = `bold ${(BOLA_R-4)*0.7}px serif`;
        ctx.fillText(currentBallInHand.numero, manoX, manoY - 3);
      }
      
      ctx.restore();
      
      ctx.setLineDash([5,5]);
      ctx.beginPath();
      ctx.moveTo(dragStart.x, dragStart.y);
      ctx.lineTo(dragStart.x + nx * power * 12, dragStart.y + ny * power * 12);
      ctx.strokeStyle = currentTurn === 1 ? '#e63946' : '#2ecc71';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.setLineDash([]);
      
      const barW = 100, barH = 8;
      const barX = dragStart.x - barW/2, barY = dragStart.y + 25;
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(barX, barY, barW, barH);
      const pct = power/MAX_POWER;
      ctx.fillStyle = pct < 0.4 ? '#2ecc71' : pct < 0.7 ? '#f39c12' : '#e74c3c';
      ctx.fillRect(barX+1, barY+1, (barW-2)*pct, barH-2);
      ctx.fillStyle = 'white';
      ctx.font = '8px monospace';
      ctx.fillText(`⚡ ${Math.round(pct*100)}%`, dragStart.x, barY+barH+10);
    } else if (gamePhase === 'aim' && !dragging && mingoPlanted && !currentBallInHand) {
      const manoX = CENTER_X;
      const manoY = LAUNCH_Y;
      ctx.beginPath();
      ctx.ellipse(manoX, manoY, 12, 16, 0, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(245,203,160,0.7)';
      ctx.fill();
      ctx.fillStyle = '#d4a373';
      ctx.font = 'bold 14px sans-serif';
      ctx.fillText('🖐️', manoX-3, manoY+5);
    }
    
    if (gamePhase === 'end' && gameWinner) {
      ctx.fillStyle = 'rgba(0,0,0,0.85)';
      ctx.fillRect(0,0,W,H);
      ctx.fillStyle = '#f4d03f';
      ctx.font = 'bold 22px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(gameWinner === 1 ? '🏆 ROJO GANA! 🏆' : '🏆 VERDE GANA! 🏆', W/2, H/2);
      ctx.font = '14px sans-serif';
      ctx.fillStyle = 'white';
      ctx.fillText(`${scores[1]} - ${scores[2]}`, W/2, H/2+40);
    }
  }
  
  function getCoords(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = W/rect.width, scaleY = H/rect.height;
    let cx, cy;
    if (e.touches) {
      cx = e.touches[0].clientX;
      cy = e.touches[0].clientY;
    } else {
      cx = e.clientX;
      cy = e.clientY;
    }
    return {
      x: (cx - rect.left) * scaleX,
      y: (cy - rect.top) * scaleY
    };
  }
  
  function onDown(e) {
    e.preventDefault();
    if (gamePhase !== 'aim') return;
    
    if (!mingoPlanted) {
      const p = getCoords(e);
      dragging = true;
      dragStart.x = p.x;
      dragStart.y = p.y;
      dragEnd.x = p.x;
      dragEnd.y = p.y;
    } else {
      actualizarBolaEnMano();
      if (currentBallInHand) {
        const p = getCoords(e);
        dragging = true;
        dragStart.x = CENTER_X;
        dragStart.y = LAUNCH_Y;
        dragEnd.x = p.x;
        dragEnd.y = p.y;
      } else {
        mostrarMensaje('⚠️ No te quedan bolas', true);
      }
    }
    dibujar();
  }
  
  function onMove(e) {
    if (!dragging) return;
    e.preventDefault();
    const p = getCoords(e);
    dragEnd.x = clamp(p.x, 0, W);
    dragEnd.y = clamp(p.y, 0, H);
    dibujar();
  }
  
  function onUp(e) {
    if (!dragging) return;
    e.preventDefault();
    dragging = false;
    if (!mingoPlanted) {
      colocarMingo(dragEnd.x, dragEnd.y);
    } else {
      if (currentBallInHand) {
        lanzarBola(dragStart.x, dragStart.y, dragEnd.x, dragEnd.y);
      }
    }
    dibujar();
  }
  
  function resetGame() {
    if (animFrame) cancelAnimationFrame(animFrame);
    iniciarJuego();
    animFrame = requestAnimationFrame(function loop() {
      actualizarFisica();
      animFrame = requestAnimationFrame(loop);
    });
  }
  
  function toggleModo() {
    isIA = !isIA;
    resetGame();
    const btn = document.getElementById('modeBtn');
    btn.textContent = isIA ? '🤖 VS COMPUTADORA' : '👥 MODO 2 JUGADORES';
    mostrarMensaje(isIA ? 'Modo VS Computadora' : 'Modo 2 Jugadores');
  }
  
  canvas.addEventListener('mousedown', onDown);
  canvas.addEventListener('mousemove', onMove);
  canvas.addEventListener('mouseup', onUp);
  canvas.addEventListener('touchstart', onDown);
  canvas.addEventListener('touchmove', onMove);
  canvas.addEventListener('touchend', onUp);
  document.getElementById('resetBtn').addEventListener('click', resetGame);
  document.getElementById('modeBtn').addEventListener('click', toggleModo);
  
  iniciarJuego();
  animFrame = requestAnimationFrame(function loop() {
    actualizarFisica();
    animFrame = requestAnimationFrame(loop);
  });
</script>
</body>
</html>
