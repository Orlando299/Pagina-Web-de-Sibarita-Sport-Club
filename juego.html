<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Bolas Criollas - Edición Especial</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;user-select:none;}
    body{background:linear-gradient(135deg, #1a1a2e, #16213e);min-height:100vh;display:flex;justify-content:center;align-items:center;font-family:'Segoe UI',Arial,sans-serif;}
    .game-container{background:#1a1a2e;border-radius:24px;padding:20px;box-shadow:0 20px 40px rgba(0,0,0,0.5);transition:transform 0.3s, box-shadow 0.3s;}
    .game-container:hover{transform:translateY(-5px);box-shadow:0 25px 50px rgba(244,208,63,0.2);}
    canvas{display:block;margin:0 auto;border-radius:16px;box-shadow:0 0 20px rgba(244,208,63,0.3);cursor:crosshair;touch-action:none;animation:fadeInUp 0.5s ease-out;}
    @keyframes fadeInUp{from{opacity:0;transform:translateY(30px);}to{opacity:1;transform:translateY(0);}}
    @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(244,208,63,0.7);}70%{box-shadow:0 0 0 15px rgba(244,208,63,0);}100%{box-shadow:0 0 0 0 rgba(244,208,63,0);}}
    .info-panel{display:flex;justify-content:space-between;align-items:center;gap:40px;margin-bottom:20px;padding:15px 30px;background:rgba(0,0,0,0.6);border-radius:60px;backdrop-filter:blur(10px);}
    .player{text-align:center;padding:8px 30px;border-radius:40px;transition:all 0.3s;}
    .player.red{background:linear-gradient(135deg,rgba(230,57,70,0.2),rgba(230,57,70,0.05));border:1px solid #e63946;}
    .player.green{background:linear-gradient(135deg,rgba(46,204,113,0.2),rgba(46,204,113,0.05));border:1px solid #2ecc71;}
    .player.active{transform:scale(1.05);box-shadow:0 0 20px currentColor;}
    .player.red.active{border-color:#e63946;box-shadow:0 0 15px #e63946;}
    .player.green.active{border-color:#2ecc71;box-shadow:0 0 15px #2ecc71;}
    .score{font-size:42px;font-weight:bold;line-height:1;}
    .player.red .score{color:#e63946;}
    .player.green .score{color:#2ecc71;}
    .player-name{font-size:14px;letter-spacing:2px;margin-top:5px;}
    .round-box{text-align:center;background:rgba(244,208,63,0.15);padding:8px 20px;border-radius:40px;border:1px solid #f4d03f;}
    .round-label{font-size:10px;color:#f4d03f;letter-spacing:2px;}
    .round-number{font-size:28px;font-weight:bold;color:#f4d03f;}
    .bolas-restantes{display:flex;gap:20px;margin-top:10px;justify-content:center;font-size:14px;font-weight:bold;}
    .bolas-restantes span.red{color:#e63946;}
    .bolas-restantes span.green{color:#2ecc71;}
    button{background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);padding:8px 20px;border-radius:30px;color:white;font-weight:bold;cursor:pointer;transition:all 0.2s;margin:0 5px;}
    button:active{transform:scale(0.95);}
    .controls{display:flex;gap:10px;justify-content:center;margin-top:15px;}
    .toast{position:fixed;bottom:30px;right:30px;background:#f4d03f;color:#1a0a00;padding:12px 24px;border-radius:40px;font-weight:bold;animation:slideIn 0.3s ease;z-index:1000;}
    @keyframes slideIn{from{transform:translateX(100%);opacity:0;}to{transform:translateX(0);opacity:1;}}
  </style>
</head>
<body>
<div>
  <div class="game-container">
    <div class="info-panel">
      <div class="player red" id="playerRed">
        <div class="score" id="scoreRed">0</div>
        <div class="player-name">🔴 ROJO</div>
      </div>
      <div class="round-box">
        <div class="round-label">RONDA</div>
        <div class="round-number" id="roundNum">1/3</div>
      </div>
      <div class="player green" id="playerGreen">
        <div class="score" id="scoreGreen">0</div>
        <div class="player-name">🟢 VERDE</div>
      </div>
    </div>
    <div class="bolas-restantes" id="bolasRestantes"></div>
    
    <canvas id="gameCanvas" width="600" height="900" style="width:100%;max-width:600px;height:auto"></canvas>
    
    <div class="controls">
      <button id="resetBtn">🔄 REINICIAR JUEGO</button>
      <button id="modeBtn">👥 MODO 2 JUGADORES</button>
    </div>
  </div>
  <div id="toast" class="toast" style="display:none"></div>
</div>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const W = 600, H = 900;
  canvas.width = W;
  canvas.height = H;
  
  // Constantes
  const MINGO_R = 10;
  const BOLA_R = 16;
  const FRICTION = 0.985;
  const MIN_SPEED = 0.5;
  const MAX_POWER = 18;
  const BALLS_PER_PLAYER = 4;
  const WALL_PENALTY = 35;
  const BOCHE_DIST = 45;
  
  const NULL_BALL_X = -80;
  const NULL_BALL_Y = -80;
  
  const RED_COLORS = ['#e63946', '#c1121f', '#ff6b6b', '#ff9a9e'];
  const GREEN_COLORS = ['#2ecc71', '#27ae60', '#58d68d', '#82e0aa'];
  
  // Estado del juego
  let mingo = { x: W/2, y: H/3, vx: 0, vy: 0 };
  let balls = [];
  let currentTurn = 1;
  let scores = {1: 0, 2: 0};
  let currentRound = 1;
  const MAX_ROUNDS = 3;
  let mingoPlanted = false;
  let gamePhase = 'aim';
  let gameWinner = null;
  let isIA = false;
  
  // Control de reglas
  let primeraRondaActiva = true;
  
  // Lanzamiento
  let dragging = false;
  let dragStart = { x: 0, y: 0 };
  let dragEnd = { x: 0, y: 0 };
  let animFrame = null;
  
  // Partículas
  let particles = [];
  
  // Ondas de colisión
  let impactWaves = [];
  
  // ==================== SONIDOS (Web Audio API) ====================
  let audioCtx = null;
  
  function initAudio() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  
  function playSound(type) {
    if (!audioCtx) initAudio();
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
    
    const oscillator = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();
    oscillator.connect(gainNode);
    gainNode.connect(audioCtx.destination);
    
    switch(type) {
      case 'throw':
        oscillator.frequency.value = 440;
        gainNode.gain.value = 0.15;
        oscillator.type = 'sine';
        gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.3);
        break;
      case 'boche':
        oscillator.frequency.value = 220;
        gainNode.gain.value = 0.2;
        oscillator.type = 'square';
        gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.2);
        break;
      case 'wall':
        oscillator.frequency.value = 110;
        gainNode.gain.value = 0.1;
        oscillator.type = 'sawtooth';
        gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.15);
        break;
      case 'win':
        oscillator.frequency.value = 880;
        gainNode.gain.value = 0.3;
        oscillator.type = 'sine';
        gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.8);
        break;
      default: return;
    }
    oscillator.start();
    oscillator.stop(audioCtx.currentTime + 0.3);
  }
  
  // ==================== PARTÍCULAS ====================
  function addParticles(x, y, color) {
    for (let i = 0; i < 8; i++) {
      particles.push({
        x: x, y: y,
        vx: (Math.random() - 0.5) * 5,
        vy: (Math.random() - 0.5) * 5,
        life: 1,
        color: color
      });
    }
  }
  
  function updateParticles() {
    for (let i = particles.length-1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.life -= 0.03;
      if (p.life <= 0) {
        particles.splice(i,1);
      }
    }
  }
  
  function drawParticles() {
    particles.forEach(p => {
      ctx.globalAlpha = p.life;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 3, 0, Math.PI*2);
      ctx.fillStyle = p.color;
      ctx.fill();
      ctx.globalAlpha = 1;
    });
  }
  
  // ==================== ONDAS DE IMPACTO ====================
  function addImpactWave(x, y) {
    impactWaves.push({ x: x, y: y, radius: 5, life: 0.8 });
    playSound('boche');
  }
  
  function updateImpactWaves() {
    for (let i = impactWaves.length-1; i >= 0; i--) {
      const w = impactWaves[i];
      w.radius += 4;
      w.life -= 0.05;
      if (w.life <= 0) {
        impactWaves.splice(i,1);
      }
    }
  }
  
  function drawImpactWaves() {
    impactWaves.forEach(w => {
      ctx.globalAlpha = w.life;
      ctx.beginPath();
      ctx.arc(w.x, w.y, w.radius, 0, Math.PI*2);
      ctx.strokeStyle = '#f4d03f';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.globalAlpha = 1;
    });
  }
  
  // ==================== FONDO ANIMADO ====================
  let bgOffset = 0;
  
  function drawAnimatedBackground() {
    bgOffset += 0.5;
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#8B6914');
    grad.addColorStop(1, '#C4A35A');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
    
    // Líneas onduladas
    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.lineWidth = 2;
    for (let i = 0; i < H; i += 30) {
      const offset = Math.sin(i * 0.02 + bgOffset * 0.02) * 10;
      ctx.beginPath();
      ctx.moveTo(0, i + offset);
      ctx.lineTo(W, i + offset + Math.sin(i * 0.01) * 5);
      ctx.stroke();
    }
  }
  
  // ==================== FUNCIONES PRINCIPALES ====================
  function mostrarMensaje(msg, error = false) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.style.background = error ? '#e74c3c' : '#f4d03f';
    toast.style.display = 'block';
    setTimeout(() => toast.style.display = 'none', 2500);
  }
  
  function actualizarUI() {
    document.getElementById('scoreRed').textContent = scores[1];
    document.getElementById('scoreGreen').textContent = scores[2];
    document.getElementById('roundNum').textContent = `${currentRound}/${MAX_ROUNDS}`;
    
    const rojasRestantes = balls.filter(b => b.owner === 1 && !b.played).length;
    const verdesRestantes = balls.filter(b => b.owner === 2 && !b.played).length;
    document.getElementById('bolasRestantes').innerHTML = `
      <span class="red">🔴 ${'●'.repeat(rojasRestantes)}</span>
      <span class="green">🟢 ${'●'.repeat(verdesRestantes)}</span>
    `;
    
    const redDiv = document.getElementById('playerRed');
    const greenDiv = document.getElementById('playerGreen');
    
    if (gamePhase === 'aim' && !gameWinner) {
      if (currentTurn === 1) {
        redDiv.classList.add('active');
        greenDiv.classList.remove('active');
      } else {
        greenDiv.classList.add('active');
        redDiv.classList.remove('active');
      }
    } else {
      redDiv.classList.remove('active');
      greenDiv.classList.remove('active');
    }
  }
  
  function distancia(a, b) {
    return Math.hypot(a.x - b.x, a.y - b.y);
  }
  
  function clamp(v, min, max) {
    return Math.max(min, Math.min(max, v));
  }
  
  function verificarPared(bola) {
    return (bola.x - bola.r < WALL_PENALTY || 
            bola.x + bola.r > W - WALL_PENALTY ||
            bola.y - bola.r < WALL_PENALTY || 
            bola.y + bola.r > H - WALL_PENALTY);
  }
  
  function anularBola(bola, motivo = '') {
    bola.wallHit = true;
    bola.played = true;
    bola.x = NULL_BALL_X;
    bola.y = NULL_BALL_Y;
    bola.vx = 0;
    bola.vy = 0;
    playSound('wall');
    mostrarMensaje(`⚠️ Bola ${bola.owner === 1 ? 'Roja' : 'Verde'} ANULADA${motivo ? ': ' + motivo : ''}`, true);
  }
  
  function obtenerJugadorGanando() {
    const bolasValidas = balls.filter(b => b.played && !b.wallHit && b.x > 0);
    if (bolasValidas.length === 0) return null;
    
    let mejorDistRoja = Infinity;
    let mejorDistVerde = Infinity;
    
    bolasValidas.forEach(b => {
      const d = distancia(b, mingo);
      if (b.owner === 1 && d < mejorDistRoja) mejorDistRoja = d;
      if (b.owner === 2 && d < mejorDistVerde) mejorDistVerde = d;
    });
    
    if (mejorDistRoja === Infinity && mejorDistVerde === Infinity) return null;
    if (mejorDistRoja === Infinity) return 2;
    if (mejorDistVerde === Infinity) return 1;
    if (mejorDistRoja < mejorDistVerde) return 1;
    if (mejorDistVerde < mejorDistRoja) return 2;
    return null;
  }
  
  function obtenerQuienDebeTirar() {
    if (!mingoPlanted) return currentTurn;
    
    const bolasValidas = balls.filter(b => b.played && !b.wallHit && b.x > 0);
    const rojasJugadas = bolasValidas.filter(b => b.owner === 1).length;
    const verdesJugadas = bolasValidas.filter(b => b.owner === 2).length;
    
    const rojasRestantes = balls.filter(b => b.owner === 1 && !b.played).length;
    const verdesRestantes = balls.filter(b => b.owner === 2 && !b.played).length;
    
    if (primeraRondaActiva) {
      if (rojasJugadas === 0) return 1;
      if (rojasJugadas > 0 && verdesJugadas === 0) return 2;
      if (rojasJugadas >= 1 && verdesJugadas >= 1) {
        primeraRondaActiva = false;
        mostrarMensaje('📢 Fin de primera ronda. Ahora juega el que VA PERDIENDO');
      }
    }
    
    if (rojasRestantes === 0 && verdesRestantes > 0) return 2;
    if (verdesRestantes === 0 && rojasRestantes > 0) return 1;
    
    if (!primeraRondaActiva && rojasRestantes > 0 && verdesRestantes > 0) {
      const jugadorGanando = obtenerJugadorGanando();
      if (jugadorGanando !== null) {
        return jugadorGanando === 1 ? 2 : 1;
      }
    }
    
    return currentTurn;
  }
  
  function aplicarBoche(bolaObjetivo, bolaOrigen) {
    const angulo = Math.atan2(bolaObjetivo.y - bolaOrigen.y, bolaObjetivo.x - bolaOrigen.x);
    bolaObjetivo.x += Math.cos(angulo) * BOCHE_DIST;
    bolaObjetivo.y += Math.sin(angulo) * BOCHE_DIST;
    bolaObjetivo.x = clamp(bolaObjetivo.x, BOLA_R + 10, W - BOLA_R - 10);
    bolaObjetivo.y = clamp(bolaObjetivo.y, BOLA_R + 10, H - BOLA_R - 10);
    
    addImpactWave(bolaObjetivo.x, bolaObjetivo.y);
    addParticles(bolaObjetivo.x, bolaObjetivo.y, '#f4d03f');
    
    if (verificarPared(bolaObjetivo)) {
      anularBola(bolaObjetivo, 'Boche contra pared');
    }
  }
  
  function resolverColision(a, b) {
    const dx = b.x - a.x;
    const dy = b.y - a.y;
    const d = Math.hypot(dx, dy);
    if (d === 0) return;
    const overlap = (a.r + b.r) - d;
    if (overlap <= 0) return;
    const nx = dx / d;
    const ny = dy / d;
    a.x -= nx * overlap / 2;
    a.y -= ny * overlap / 2;
    b.x += nx * overlap / 2;
    b.y += ny * overlap / 2;
    const vrelx = b.vx - a.vx;
    const vrely = b.vy - a.vy;
    const dot = vrelx * nx + vrely * ny;
    if (dot < 0) {
      const e = 0.7;
      const imp = (1 + e) * dot / 2;
      a.vx += imp * nx;
      a.vy += imp * ny;
      b.vx -= imp * nx;
      b.vy -= imp * ny;
    }
  }
  
  function iniciarJuego() {
    mingo = { x: W/2, y: H/3, vx: 0, vy: 0 };
    balls = [];
    for (let i = 0; i < BALLS_PER_PLAYER; i++) {
      balls.push({
        id: `r${i}`, owner: 1, r: BOLA_R,
        x: 40 + i * (BOLA_R * 2 + 8), y: H - 60,
        vx: 0, vy: 0, color: RED_COLORS[i],
        played: false, wallHit: false, boched: false
      });
    }
    for (let i = 0; i < BALLS_PER_PLAYER; i++) {
      balls.push({
        id: `g${i}`, owner: 2, r: BOLA_R,
        x: W - 40 - i * (BOLA_R * 2 + 8), y: H - 60,
        vx: 0, vy: 0, color: GREEN_COLORS[i],
        played: false, wallHit: false, boched: false
      });
    }
    currentTurn = 1;
    mingoPlanted = false;
    gamePhase = 'aim';
    gameWinner = null;
    primeraRondaActiva = true;
    particles = [];
    impactWaves = [];
    actualizarUI();
    dibujar();
    mostrarMensaje('🎯 Arrastra desde la mano para lanzar el MINGO');
  }
  
  function finTurno() {
    const ultimaBola = balls.filter(b => b.played && !b.wallHit && b.x > 0).pop();
    if (ultimaBola && verificarPared(ultimaBola)) {
      anularBola(ultimaBola, 'Tocó la pared');
    }
    
    const sinJugar = balls.filter(b => !b.played);
    
    if (!mingoPlanted) {
      gamePhase = 'aim';
      mingoPlanted = true;
      currentTurn = 1;
      primeraRondaActiva = true;
      actualizarUI();
      mostrarMensaje('🎯 Mingo plantado. PRIMERA RONDA: Turno del ROJO');
      dibujar();
      return;
    }
    
    if (sinJugar.length > 0) {
      const quienDebeTirar = obtenerQuienDebeTirar();
      currentTurn = quienDebeTirar;
      
      const ganando = obtenerJugadorGanando();
      const rojasRestantes = balls.filter(b => b.owner === 1 && !b.played).length;
      const verdesRestantes = balls.filter(b => b.owner === 2 && !b.played).length;
      
      if (!primeraRondaActiva && ganando !== null && rojasRestantes > 0 && verdesRestantes > 0) {
        if (ganando === 1) {
          mostrarMensaje('🟢 Turno del VERDE (Rojo está ganando)');
        } else {
          mostrarMensaje('🔴 Turno del ROJO (Verde está ganando)');
        }
      } else if (rojasRestantes === 0 && verdesRestantes > 0) {
        mostrarMensaje('🟢 Rojo sin bolas. Verde juega sus bolas restantes');
      } else if (verdesRestantes === 0 && rojasRestantes > 0) {
        mostrarMensaje('🔴 Verde sin bolas. Rojo juega sus bolas restantes');
      } else {
        mostrarMensaje(currentTurn === 1 ? '🔴 Turno del ROJO' : '🟢 Turno del VERDE');
      }
      
      gamePhase = 'aim';
      actualizarUI();
      dibujar();
      
      if (isIA && currentTurn === 2 && gamePhase === 'aim') {
        setTimeout(() => iaLanzar(), 500);
      }
      return;
    }
    
    const bolasValidas = balls.filter(b => b.played && !b.wallHit && b.x > 0);
    let mejorDistRoja = Infinity, mejorDistVerde = Infinity;
    
    bolasValidas.forEach(b => {
      const d = distancia(b, mingo);
      if (b.owner === 1 && d < mejorDistRoja) mejorDistRoja = d;
      if (b.owner === 2 && d < mejorDistVerde) mejorDistVerde = d;
    });
    
    let ganadorRonda = null;
    if (mejorDistRoja < mejorDistVerde && mejorDistRoja !== Infinity) {
      ganadorRonda = 1;
      const puntos = bolasValidas.filter(b => b.owner === 1 && distancia(b, mingo) < mejorDistVerde).length;
      scores[1] += puntos;
      mostrarMensaje(`✅ Ronda ${currentRound}: Rojo gana +${puntos}`);
    } else if (mejorDistVerde < mejorDistRoja && mejorDistVerde !== Infinity) {
      ganadorRonda = 2;
      const puntos = bolasValidas.filter(b => b.owner === 2 && distancia(b, mingo) < mejorDistRoja).length;
      scores[2] += puntos;
      mostrarMensaje(`✅ Ronda ${currentRound}: Verde gana +${puntos}`);
    } else {
      mostrarMensaje(`🤝 Ronda ${currentRound}: Empate`);
    }
    
    actualizarUI();
    
    if (currentRound >= MAX_ROUNDS) {
      gameWinner = scores[1] > scores[2] ? 1 : scores[2] > scores[1] ? 2 : 0;
      gamePhase = 'end';
      playSound('win');
      mostrarMensaje(gameWinner === 0 ? '¡EMPATE FINAL!' : `🏆 ${gameWinner === 1 ? 'ROJO' : 'VERDE'} GANA!`);
      actualizarUI();
      dibujar();
      return;
    }
    
    currentRound++;
    const nuevasBolas = [];
    for (let i = 0; i < BALLS_PER_PLAYER; i++) {
      nuevasBolas.push({
        id: `r${i}`, owner: 1, r: BOLA_R,
        x: 40 + i * (BOLA_R * 2 + 8), y: H - 60,
        vx: 0, vy: 0, color: RED_COLORS[i],
        played: false, wallHit: false, boched: false
      });
    }
    for (let i = 0; i < BALLS_PER_PLAYER; i++) {
      nuevasBolas.push({
        id: `g${i}`, owner: 2, r: BOLA_R,
        x: W - 40 - i * (BOLA_R * 2 + 8), y: H - 60,
        vx: 0, vy: 0, color: GREEN_COLORS[i],
        played: false, wallHit: false, boched: false
      });
    }
    balls = nuevasBolas;
    mingo = { x: W/2, y: H/3, vx: 0, vy: 0 };
    mingoPlanted = false;
    currentTurn = ganadorRonda || 1;
    gamePhase = 'aim';
    primeraRondaActiva = true;
    actualizarUI();
    mostrarMensaje(`🎲 RONDA ${currentRound} - PRIMERA RONDA: Empieza ${currentTurn === 1 ? 'Rojo' : 'Verde'}`);
    dibujar();
  }
  
  function actualizarFisica() {
    if (gamePhase !== 'rolling') return;
    
    let moviendo = false;
    const objetos = [];
    if (mingo.vx !== 0 || mingo.vy !== 0) objetos.push(mingo);
    balls.forEach(b => { if (b.played && !b.wallHit && (b.vx !== 0 || b.vy !== 0)) objetos.push(b); });
    
    objetos.forEach(o => {
      o.x += o.vx;
      o.y += o.vy;
      o.vx *= FRICTION;
      o.vy *= FRICTION;
      if (o.x - o.r < 0) { o.x = o.r; o.vx *= -0.5; }
      if (o.x + o.r > W) { o.x = W - o.r; o.vx *= -0.5; }
      if (o.y - o.r < 0) { o.y = o.r; o.vy *= -0.5; }
      if (o.y + o.r > H) { o.y = H - o.r; o.vy *= -0.5; }
      if (Math.abs(o.vx) < MIN_SPEED) o.vx = 0;
      if (Math.abs(o.vy) < MIN_SPEED) o.vy = 0;
      if (o.vx !== 0 || o.vy !== 0) moviendo = true;
    });
    
    const bolasJugadas = balls.filter(b => b.played && !b.wallHit);
    for (let i = 0; i < bolasJugadas.length; i++) {
      for (let j = i + 1; j < bolasJugadas.length; j++) {
        const bolaA = bolasJugadas[i];
        const bolaB = bolasJugadas[j];
        if (bolaA.owner !== bolaB.owner && distancia(bolaA, bolaB) < bolaA.r + bolaB.r) {
          const velA = Math.abs(bolaA.vx) + Math.abs(bolaA.vy);
          const velB = Math.abs(bolaB.vx) + Math.abs(bolaB.vy);
          
          if (velA < velB) {
            aplicarBoche(bolaA, bolaB);
            mostrarMensaje(`💥 ¡BOCHE! Bola ${bolaA.owner === 1 ? 'Roja' : 'Verde'} fue desplazada`);
          } else {
            aplicarBoche(bolaB, bolaA);
            mostrarMensaje(`💥 ¡BOCHE! Bola ${bolaB.owner === 1 ? 'Roja' : 'Verde'} fue desplazada`);
          }
        }
      }
    }
    
    for (let i = 0; i < objetos.length; i++) {
      for (let j = i + 1; j < objetos.length; j++) {
        if (distancia(objetos[i], objetos[j]) < objetos[i].r + objetos[j].r) {
          resolverColision(objetos[i], objetos[j]);
        }
      }
    }
    
    updateParticles();
    updateImpactWaves();
    
    if (!moviendo && objetos.length > 0) finTurno();
    dibujar();
  }
  
  function lanzarMingo(fromX, fromY, toX, toY) {
    const dx = toX - fromX;
    const dy = toY - fromY;
    const len = Math.hypot(dx, dy);
    if (len === 0) return;
    const power = Math.min(len / 2.8, MAX_POWER * 0.8);
    mingo.x = fromX;
    mingo.y = fromY;
    mingo.vx = (dx / len) * power;
    mingo.vy = (dy / len) * power;
    gamePhase = 'rolling';
    playSound('throw');
    addParticles(fromX, fromY, '#f4d03f');
    actualizarUI();
    mostrarMensaje('🎯 Lanzando Mingo...');
  }
  
  function lanzarBola(fromX, fromY, toX, toY) {
    const disponibles = balls.filter(b => b.owner === currentTurn && !b.played);
    if (disponibles.length === 0) {
      mostrarMensaje('⚠️ No te quedan bolas', true);
      return;
    }
    const bola = disponibles[0];
    const idx = parseInt(bola.id.substring(1));
    if (bola.owner === 1) {
      bola.x = 40 + idx * (BOLA_R * 2 + 8);
      bola.y = H - 60;
    } else {
      bola.x = W - 40 - idx * (BOLA_R * 2 + 8);
      bola.y = H - 60;
    }
    const dx = toX - fromX;
    const dy = toY - fromY;
    const len = Math.hypot(dx, dy);
    if (len === 0) return;
    const power = Math.min(len / 2.5, MAX_POWER);
    bola.vx = (dx / len) * power;
    bola.vy = (dy / len) * power;
    bola.played = true;
    bola.boched = false;
    gamePhase = 'rolling';
    playSound('throw');
    addParticles(bola.x, bola.y, bola.color);
    actualizarUI();
    mostrarMensaje(`🎳 ${currentTurn === 1 ? 'Rojo' : 'Verde'} lanzó bola ${idx+1}`);
  }
  
  function iaLanzar() {
    if (gamePhase !== 'aim' || currentTurn !== 2) return;
    const disponibles = balls.filter(b => b.owner === 2 && !b.played);
    if (disponibles.length === 0) return;
    const bola = disponibles[0];
    const idx = parseInt(bola.id.substring(1));
    const startX = W - 40 - idx * (BOLA_R * 2 + 8);
    const startY = H - 60;
    let targetX = mingo.x + (Math.random() - 0.5) * 70;
    let targetY = mingo.y + (Math.random() - 0.5) * 70;
    targetX = clamp(targetX, 50, W-50);
    targetY = clamp(targetY, 60, H-60);
    const dx = targetX - startX;
    const dy = targetY - startY;
    const len = Math.hypot(dx, dy);
    const power = Math.min(len / 2.5, MAX_POWER);
    bola.x = startX;
    bola.y = startY;
    bola.vx = (dx / len) * power;
    bola.vy = (dy / len) * power;
    bola.played = true;
    bola.boched = false;
    gamePhase = 'rolling';
    playSound('throw');
    addParticles(bola.x, bola.y, bola.color);
    actualizarUI();
    mostrarMensaje('🤖 IA lanzando...');
  }
  
  function dibujar() {
    drawAnimatedBackground();
    
    ctx.strokeStyle = '#ff0000aa';
    ctx.setLineDash([5,5]);
    ctx.strokeRect(WALL_PENALTY, WALL_PENALTY, W - WALL_PENALTY*2, H - WALL_PENALTY*2);
    ctx.setLineDash([]);
    
    ctx.strokeStyle = '#5C4010';
    ctx.lineWidth = 8;
    ctx.strokeRect(5,5,W-10,H-10);
    ctx.strokeStyle = '#D4B05A';
    ctx.lineWidth = 2;
    ctx.strokeRect(10,10,W-20,H-20);
    
    ctx.beginPath();
    ctx.moveTo(W/2,15);
    ctx.lineTo(W/2,H-15);
    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.setLineDash([10,10]);
    ctx.stroke();
    ctx.setLineDash([]);
    
    if (mingoPlanted) {
      [30,55,85,120].forEach((r,i) => {
        ctx.beginPath();
        ctx.arc(mingo.x, mingo.y, r, 0, Math.PI*2);
        ctx.strokeStyle = `rgba(244,208,63,${0.3 - i*0.05})`;
        ctx.stroke();
      });
    }
    
    if (mingoPlanted) {
      ctx.beginPath();
      ctx.arc(mingo.x, mingo.y, MINGO_R, 0, Math.PI*2);
      ctx.fillStyle = '#f4d03f';
      ctx.fill();
      ctx.fillStyle = '#d4a017';
      ctx.font = 'bold 12px serif';
      ctx.textAlign = 'center';
      ctx.fillText('⚜️', mingo.x, mingo.y+4);
      
      // Efecto de brillo/pulso en el Mingo
      ctx.shadowBlur = 15;
      ctx.shadowColor = '#f4d03f';
      ctx.beginPath();
      ctx.arc(mingo.x, mingo.y, MINGO_R + 3, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(244,208,63,0.3)';
      ctx.fill();
      ctx.shadowBlur = 0;
    }
    
    balls.forEach(b => {
      if (!b.played || b.x < 0) return;
      if (b.wallHit) {
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r + 2, 0, Math.PI*2);
        ctx.strokeStyle = '#ff0000';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.fillStyle = '#ff0000';
        ctx.font = 'bold 12px sans-serif';
        ctx.fillText('✘', b.x, b.y-10);
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 8px sans-serif';
        ctx.fillText('ANULADA', b.x, b.y-20);
      }
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, Math.PI*2);
      ctx.fillStyle = b.color;
      ctx.fill();
      ctx.fillStyle = 'white';
      ctx.font = `bold ${b.r*0.7}px serif`;
      ctx.fillText(parseInt(b.id.substring(1))+1, b.x, b.y+5);
    });
    
    // Indicador de mejor bola (estrella)
    if (mingoPlanted) {
      const bolasValidas = balls.filter(b => b.played && !b.wallHit && b.x > 0);
      let mejorRoja = null, mejorVerde = null;
      let mejorDistRoja = Infinity, mejorDistVerde = Infinity;
      bolasValidas.forEach(b => {
        const d = distancia(b, mingo);
        if (b.owner === 1 && d < mejorDistRoja) { mejorDistRoja = d; mejorRoja = b; }
        if (b.owner === 2 && d < mejorDistVerde) { mejorDistVerde = d; mejorVerde = b; }
      });
      
      if (mejorRoja) {
        ctx.fillStyle = '#f4d03f';
        ctx.font = 'bold 16px sans-serif';
        ctx.fillText('⭐', mejorRoja.x - 12, mejorRoja.y - 8);
      }
      if (mejorVerde) {
        ctx.fillStyle = '#f4d03f';
        ctx.font = 'bold 16px sans-serif';
        ctx.fillText('⭐', mejorVerde.x - 12, mejorVerde.y - 8);
      }
    }
    
    balls.forEach(b => {
      if (b.played) return;
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r-1, 0, Math.PI*2);
      ctx.fillStyle = b.color;
      ctx.fill();
      ctx.fillStyle = 'white';
      ctx.font = `bold ${b.r-4}px serif`;
      ctx.fillText(parseInt(b.id.substring(1))+1, b.x, b.y+4);
    });
    
    drawParticles();
    drawImpactWaves();
    
    if (dragging && gamePhase === 'aim') {
      const dx = dragEnd.x - dragStart.x;
      const dy = dragEnd.y - dragStart.y;
      const len = Math.hypot(dx, dy);
      const power = Math.min(len / 2.5, MAX_POWER);
      const nx = dx/(len||1);
      const ny = dy/(len||1);
      
      ctx.save();
      ctx.shadowBlur = 0;
      const manoX = dragStart.x;
      const manoY = dragStart.y;
      
      ctx.beginPath();
      ctx.ellipse(manoX, manoY, 15, 20, 0, 0, Math.PI*2);
      ctx.fillStyle = '#f5cba0';
      ctx.fill();
      ctx.strokeStyle = '#d4a373';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      
      const anguloDedo = Math.atan2(ny, nx);
      const puntaX = manoX + nx * 25;
      const puntaY = manoY + ny * 25;
      ctx.beginPath();
      ctx.moveTo(manoX + nx * 8, manoY + ny * 8);
      ctx.lineTo(puntaX, puntaY);
      ctx.lineTo(manoX + nx * 8 + ny * 6, manoY + ny * 8 - nx * 6);
      ctx.fillStyle = '#f5cba0';
      ctx.fill();
      
      ctx.beginPath();
      ctx.moveTo(manoX + nx * 8 - ny * 6, manoY + ny * 8 + nx * 6);
      ctx.lineTo(manoX + nx * 20 - ny * 6, manoY + ny * 20 + nx * 6);
      ctx.lineTo(manoX + nx * 8 - ny * 12, manoY + ny * 8 + nx * 12);
      ctx.fill();
      
      ctx.restore();
      
      ctx.setLineDash([6, 6]);
      ctx.beginPath();
      ctx.moveTo(dragStart.x, dragStart.y);
      ctx.lineTo(dragStart.x + nx * power * 14, dragStart.y + ny * power * 14);
      ctx.strokeStyle = currentTurn === 1 ? '#e63946' : '#2ecc71';
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.setLineDash([]);
      
      const barW = 140, barH = 12;
      const barX = dragStart.x - barW/2;
      const barY = dragStart.y + 40;
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(barX, barY, barW, barH);
      const pct = power/MAX_POWER;
      ctx.fillStyle = pct < 0.4 ? '#2ecc71' : pct < 0.7 ? '#f39c12' : '#e74c3c';
      ctx.fillRect(barX+2, barY+2, (barW-4)*pct, barH-4);
      ctx.fillStyle = 'white';
      ctx.font = '10px monospace';
      ctx.fillText(`⚡ ${Math.round(pct*100)}%`, dragStart.x, barY+barH+14);
    } else if (gamePhase === 'aim' && !dragging && mingoPlanted) {
      const manoX = W/2;
      const manoY = H - 40;
      ctx.beginPath();
      ctx.ellipse(manoX, manoY, 15, 20, 0, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(245,203,160,0.7)';
      ctx.fill();
      ctx.fillStyle = '#d4a373';
      ctx.font = 'bold 20px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('🖐️', manoX, manoY+8);
    }
    
    const bolasAnuladas = balls.filter(b => b.played && b.wallHit && b.x < 0);
    if (bolasAnuladas.length > 0) {
      ctx.font = 'bold 10px sans-serif';
      ctx.fillStyle = '#ff6666';
      ctx.textAlign = 'left';
      ctx.fillText(`✘ Bolas anuladas: ${bolasAnuladas.length}`, 10, 30);
    }
    
    if (gamePhase === 'end' && gameWinner) {
      ctx.fillStyle = 'rgba(0,0,0,0.85)';
      ctx.fillRect(0,0,W,H);
      ctx.fillStyle = '#f4d03f';
      ctx.font = 'bold 36px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(gameWinner === 1 ? '🏆 ROJO GANA! 🏆' : '🏆 VERDE GANA! 🏆', W/2, H/2);
      ctx.font = '20px sans-serif';
      ctx.fillStyle = 'white';
      ctx.fillText(`${scores[1]} - ${scores[2]}`, W/2, H/2+60);
    }
  }
  
  function getCoords(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = W/rect.width;
    const scaleY = H/rect.height;
    let cx, cy;
    if (e.touches) {
      cx = e.touches[0].clientX;
      cy = e.touches[0].clientY;
    } else {
      cx = e.clientX;
      cy = e.clientY;
    }
    return {
      x: (cx - rect.left) * scaleX,
      y: (cy - rect.top) * scaleY
    };
  }
  
  function onDown(e) {
    e.preventDefault();
    initAudio();
    if (gamePhase !== 'aim') return;
    const p = getCoords(e);
    dragging = true;
    dragStart.x = p.x;
    dragStart.y = p.y;
    dragEnd.x = p.x;
    dragEnd.y = p.y;
    dibujar();
  }
  
  function onMove(e) {
    if (!dragging) return;
    e.preventDefault();
    const p = getCoords(e);
    dragEnd.x = clamp(p.x, 0, W);
    dragEnd.y = clamp(p.y, 0, H);
    dibujar();
  }
  
  function onUp(e) {
    if (!dragging) return;
    e.preventDefault();
    dragging = false;
    if (!mingoPlanted) {
      lanzarMingo(dragStart.x, dragStart.y, dragEnd.x, dragEnd.y);
    } else {
      lanzarBola(dragStart.x, dragStart.y, dragEnd.x, dragEnd.y);
    }
    dibujar();
  }
  
  function reset() {
    if (animFrame) cancelAnimationFrame(animFrame);
    iniciarJuego();
    animFrame = requestAnimationFrame(function loop() {
      actualizarFisica();
      animFrame = requestAnimationFrame(loop);
    });
  }
  
  function toggleModo() {
    isIA = !isIA;
    reset();
    const btn = document.getElementById('modeBtn');
    btn.textContent = isIA ? '🤖 VS COMPUTADORA' : '👥 MODO 2 JUGADORES';
    mostrarMensaje(isIA ? 'Modo VS Computadora' : 'Modo 2 Jugadores');
  }
  
  canvas.addEventListener('mousedown', onDown);
  canvas.addEventListener('mousemove', onMove);
  canvas.addEventListener('mouseup', onUp);
  canvas.addEventListener('touchstart', onDown);
  canvas.addEventListener('touchmove', onMove);
  canvas.addEventListener('touchend', onUp);
  document.getElementById('resetBtn').addEventListener('click', reset);
  document.getElementById('modeBtn').addEventListener('click', toggleModo);
  
  iniciarJuego();
  animFrame = requestAnimationFrame(function loop() {
    actualizarFisica();
    animFrame = requestAnimationFrame(loop);
  });
</script>
</body>
