<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Bolas Criollas - Reglas Reales</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:#0d0d0d;font-family:'Segoe UI',Arial,sans-serif;}
    canvas { touch-action: none; }
    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    .message-toast {
      animation: slideIn 0.3s ease-out;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.development.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.development.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const W = 800, H = 400;
    const MOCHE_R = 10;
    const BOLA_R = 18;
    const FRICTION = 0.985;
    const MIN_SPEED = 0.08;
    const MAX_POWER = 18;
    const BALLS_PER_PLAYER = 4;
    const WALL_PENALTY_DIST = 20; // Distancia mínima a la pared

    const COLORS = {
      p1: ["#e63946", "#c1121f", "#ff6b6b", "#ff9a9e"],
      p2: ["#2ecc71", "#27ae60", "#58d68d", "#82e0aa"],
    };

    function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }

    function resolveCollision(a, b) {
      const dx = b.x - a.x, dy = b.y - a.y;
      const d = Math.hypot(dx, dy) || 0.001;
      const overlap = a.r + b.r - d;
      if (overlap <= 0) return;
      const nx = dx / d, ny = dy / d;
      a.x -= nx * overlap / 2; a.y -= ny * overlap / 2;
      b.x += nx * overlap / 2; b.y += ny * overlap / 2;
      const p = 2 * (a.vx * nx + a.vy * ny - b.vx * nx - b.vy * ny) / 2;
      a.vx -= p * nx; a.vy -= p * ny;
      b.vx += p * nx; b.vy += p * ny;
    }

    function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

    function lighten(hex) {
      const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
      return `rgb(${Math.min(255, r + 70)}, ${Math.min(255, g + 70)}, ${Math.min(255, b + 70)})`;
    }
    function darken(hex) {
      const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
      return `rgb(${Math.max(0, r - 50)}, ${Math.max(0, g - 50)}, ${Math.max(0, b - 50)})`;
    }

    if (!CanvasRenderingContext2D.prototype.roundRect) {
      CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
        if (w < 2 * r) r = w / 2;
        if (h < 2 * r) r = h / 2;
        this.moveTo(x + r, y);
        this.lineTo(x + w - r, y);
        this.quadraticCurveTo(x + w, y, x + w, y + r);
        this.lineTo(x + w, y + h - r);
        this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        this.lineTo(x + r, y + h);
        this.quadraticCurveTo(x, y + h, x, y + h - r);
        this.lineTo(x, y + r);
        this.quadraticCurveTo(x, y, x + r, y);
        return this;
      };
    }

    // Verificar si una bola tocó la pared
    function checkWallHit(ball) {
      return (ball.x - ball.r < WALL_PENALTY_DIST || 
              ball.x + ball.r > W - WALL_PENALTY_DIST ||
              ball.y - ball.r < WALL_PENALTY_DIST || 
              ball.y + ball.r > H - WALL_PENALTY_DIST);
    }

    // Aplicar boche: desplazar bola rival
    function applyBoche(targetBall, sourceBall) {
      const angle = Math.atan2(targetBall.y - sourceBall.y, targetBall.x - sourceBall.x);
      const displacement = 45; // Distancia a desplazar
      targetBall.x += Math.cos(angle) * displacement;
      targetBall.y += Math.sin(angle) * displacement;
      // Mantener dentro del campo
      targetBall.x = clamp(targetBall.x, WALL_PENALTY_DIST + targetBall.r, W - WALL_PENALTY_DIST - targetBall.r);
      targetBall.y = clamp(targetBall.y, WALL_PENALTY_DIST + targetBall.r, H - WALL_PENALTY_DIST - targetBall.r);
      return true;
    }

    // Determinar qué jugador debe tirar según la bola más lejana al moche
    function getPlayerWhoShouldThrow(state) {
      if (!state.mocheThrown) return state.turn; // Si no hay moche, tira el que tenga el turno
      
      const playedBalls = state.balls.filter(b => b.played);
      if (playedBalls.length === 0) return state.turn;
      
      // Encontrar la bola más lejana al moche entre todas las jugadas
      let farthestBall = null;
      let farthestDist = -1;
      
      playedBalls.forEach(ball => {
        const d = dist(ball, state.moche);
        if (d > farthestDist) {
          farthestDist = d;
          farthestBall = ball;
        }
      });
      
      // El dueño de la bola más lejana debe tirar
      return farthestBall ? farthestBall.owner : state.turn;
    }

    // Verificar si el jugador actual puede tirar (regla de bola más lejana)
    function isValidTurn(state) {
      if (!state.mocheThrown) return true; // Fase de lanzar moche
      const shouldBe = getPlayerWhoShouldThrow(state);
      return state.turn === shouldBe;
    }

    function initState() {
      return {
        moche: { x: W / 2, y: H / 2, vx: 0, vy: 0, r: MOCHE_R, color: "#f4d03f", id: "moche" },
        balls: [
          ...Array.from({ length: BALLS_PER_PLAYER }, (_, i) => ({
            id: `p1_${i}`, owner: 1, r: BOLA_R,
            x: W - 50 - i * (BOLA_R * 2 + 5), y: H - 35,
            vx: 0, vy: 0, color: COLORS.p1[i], played: false, wallHit: false, boched: false
          })),
          ...Array.from({ length: BALLS_PER_PLAYER }, (_, i) => ({
            id: `p2_${i}`, owner: 2, r: BOLA_R,
            x: 50 + i * (BOLA_R * 2 + 5), y: H - 35,
            vx: 0, vy: 0, color: COLORS.p2[i], played: false, wallHit: false, boched: false
          })),
        ],
        turn: 1,
        phase: "aim",
        scores: { 1: 0, 2: 0 },
        round: 1,
        maxRounds: 3,
        winner: null,
        mocheThrown: false,
        repeatThrowAvailable: false,
        currentThrowValid: true,
      };
    }

    function BolasCreollas() {
      const canvasRef = React.useRef(null);
      const stateRef = React.useRef(initState());
      const [ui, setUi] = React.useState({ 
        turn: 1, phase: "aim", scores: { 1: 0, 2: 0 }, round: 1, winner: null, 
        mocheThrown: false, message: "", repeatAvailable: false, currentPlayerShouldThrow: true 
      });
      const aimRef = React.useRef({ active: false, startX: 0, startY: 0, endX: 0, endY: 0 });
      const gameMode = React.useRef("pvp");

      const addMessage = (msg, isError = false) => {
        setUi(prev => ({ ...prev, message: msg }));
        setTimeout(() => setUi(prev => ({ ...prev, message: "" })), 3000);
      };

      const refreshUi = () => {
        const gs = stateRef.current;
        const isValid = isValidTurn(gs);
        setUi({ 
          turn: gs.turn, phase: gs.phase, scores: { ...gs.scores }, 
          round: gs.round, winner: gs.winner, mocheThrown: gs.mocheThrown, 
          message: ui.message, repeatAvailable: gs.repeatThrowAvailable,
          currentPlayerShouldThrow: isValid
        });
      };

      const endOfThrow = React.useCallback(() => {
        const gs = stateRef.current;
        
        // Verificar si la bola actual tocó la pared
        const lastBall = gs.balls.filter(b => b.played && !b.wallHit).pop();
        if (lastBall && checkWallHit(lastBall)) {
          lastBall.wallHit = true;
          addMessage(`⚠️ Bola tocó la pared ¡ANULADA! No suma puntos`, true);
        }
        
        const unplayed = gs.balls.filter(b => !b.played);
        
        if (!gs.mocheThrown) {
          gs.phase = "aim";
          gs.mocheThrown = true;
          gs.repeatThrowAvailable = false;
          refreshUi();
          addMessage("🎯 ¡Moche colocado! Ahora lanza tus bolas. Recuerda: tira quien tiene la bola MÁS LEJANA");
          return;
        }
        
        if (unplayed.length > 0) {
          // Cambiar turno según la regla real
          const nextPlayer = getPlayerWhoShouldThrow(gs);
          if (nextPlayer !== gs.turn) {
            gs.turn = nextPlayer;
            gs.repeatThrowAvailable = false;
            const msg = gs.turn === 1 ? "🔴 Turno de Jugador Rojo (tiene la bola más lejana)" : "🟢 Turno de Jugador Verde (tiene la bola más lejana)";
            addMessage(msg);
          } else {
            // El mismo jugador puede repetir si no era el más lejano (esto ya se validó al tirar)
            gs.repeatThrowAvailable = false;
          }
          gs.phase = "aim";
          refreshUi();
          
          if (gameMode.current === "pvc" && gs.turn === 2) {
            setTimeout(() => aiThrow(), 800);
          }
          return;
        }
        
        // Fin de la ronda: calcular puntajes considerando pared
        const m = gs.moche;
        const validBalls = gs.balls.filter(b => b.played && !b.wallHit);
        
        // Encontrar la bola más cercana de cada jugador (solo las válidas)
        let d1 = Infinity, d2 = Infinity;
        validBalls.forEach(b => {
          const d = dist(b, m);
          if (b.owner === 1 && d < d1) d1 = d;
          if (b.owner === 2 && d < d2) d2 = d;
        });
        
        let roundWinner = null;
        if (d1 < d2 && d1 !== Infinity) {
          roundWinner = 1;
          const pts = validBalls.filter(b => b.owner === 1 && dist(b, m) < d2).length;
          gs.scores[1] += pts;
          addMessage(`✅ Ronda ${gs.round}: Jugador Rojo gana +${pts} punto(s)`);
        } else if (d2 < d1 && d2 !== Infinity) {
          roundWinner = 2;
          const pts = validBalls.filter(b => b.owner === 2 && dist(b, m) < d1).length;
          gs.scores[2] += pts;
          addMessage(`✅ Ronda ${gs.round}: Jugador Verde gana +${pts} punto(s)`);
        } else {
          addMessage(`🤝 Ronda ${gs.round}: Empate - Nadie gana puntos`);
        }
        
        if (gs.round >= gs.maxRounds) {
          const winner = gs.scores[1] > gs.scores[2] ? 1 : gs.scores[2] > gs.scores[1] ? 2 : 0;
          gs.phase = "end";
          gs.winner = winner;
          refreshUi();
          addMessage(winner === 0 ? "¡EMPATE!" : `🏆 ¡Jugador ${winner === 1 ? "Rojo" : "Verde"} gana el juego!`);
        } else {
          const next = initState();
          next.scores = gs.scores;
          next.round = gs.round + 1;
          next.turn = roundWinner || 1;
          next.maxRounds = gs.maxRounds;
          stateRef.current = next;
          refreshUi();
          addMessage(`🎲 Ronda ${next.round} - Comienza ${roundWinner ? `Jugador ${roundWinner === 1 ? "Rojo" : "Verde"}` : "el ganador de la ronda anterior"}`);
        }
      }, []);

      const aiThrow = React.useCallback(() => {
        const gs = stateRef.current;
        if (gs.phase !== "aim" || gs.turn !== 2) return;
        
        // Validar que sea el turno correcto según reglas reales
        if (!isValidTurn(gs)) {
          addMessage("🤖 IA: No es mi turno (tengo bola más cercana)", true);
          return;
        }
        
        const unplayed = gs.balls.filter(b => b.owner === 2 && !b.played);
        if (!unplayed.length) return;
        const b = unplayed[0];
        
        // IA inteligente: apunta cerca del moche pero evitando paredes
        let tx = gs.moche.x + (Math.random() - 0.5) * 50;
        let ty = gs.moche.y + (Math.random() - 0.5) * 50;
        tx = clamp(tx, 60, W - 60);
        ty = clamp(ty, 60, H - 60);
        
        const bankIdx = parseInt(b.id.split("_")[1]);
        const startX = 50 + bankIdx * (BOLA_R * 2 + 5);
        const startY = H - 35;
        const dx = tx - startX, dy = ty - startY;
        const len = Math.hypot(dx, dy);
        const power = clamp(len / 28, 5, MAX_POWER * 0.8);
        b.vx = (dx / len) * power;
        b.vy = (dy / len) * power;
        b.x = startX; b.y = startY;
        b.played = true;
        gs.phase = "rolling";
        refreshUi();
        addMessage("🤖 IA lanzando bola...");
      }, []);

      const tick = React.useCallback(() => {
        const gs = stateRef.current;
        if (gs.phase !== "rolling") return;
        
        let anyMoving = false;
        const movingBalls = [];
        
        // Solo mover la bola que se acaba de lanzar y el moche si está en movimiento
        if (gs.moche.vx !== 0 || gs.moche.vy !== 0) {
          movingBalls.push(gs.moche);
        }
        
        gs.balls.forEach(ball => {
          if (ball.played && (ball.vx !== 0 || ball.vy !== 0)) {
            movingBalls.push(ball);
          }
        });
        
        movingBalls.forEach(b => {
          b.x += b.vx; b.y += b.vy;
          b.vx *= FRICTION; b.vy *= FRICTION;
          
          // Colisiones con paredes (sin anular aún, solo rebote)
          if (b.x - b.r < 20) { b.x = 20 + b.r; b.vx *= -0.5; }
          if (b.x + b.r > W - 20) { b.x = W - 20 - b.r; b.vx *= -0.5; }
          if (b.y - b.r < 20) { b.y = 20 + b.r; b.vy *= -0.5; }
          if (b.y + b.r > H - 20) { b.y = H - 20 - b.r; b.vy *= -0.5; }
          
          if (Math.abs(b.vx) < MIN_SPEED) b.vx = 0;
          if (Math.abs(b.vy) < MIN_SPEED) b.vy = 0;
          if (b.vx !== 0 || b.vy !== 0) anyMoving = true;
        });
        
        // Detectar boche (colisión entre bolas de diferentes dueños)
        const playedBalls = gs.balls.filter(b => b.played);
        for (let i = 0; i < playedBalls.length; i++) {
          for (let j = i + 1; j < playedBalls.length; j++) {
            const ballA = playedBalls[i];
            const ballB = playedBalls[j];
            if (ballA.owner !== ballB.owner && dist(ballA, ballB) < ballA.r + ballB.r) {
              // Aplicar boche a la bola que fue golpeada (la que tiene menor velocidad)
              if (Math.abs(ballA.vx) + Math.abs(ballA.vy) < Math.abs(ballB.vx) + Math.abs(ballB.vy)) {
                if (!ballA.boched) {
                  applyBoche(ballA, ballB);
                  ballA.boched = true;
                  addMessage(`💥 ¡BOCHE! Bola ${ballA.owner === 1 ? "Roja" : "Verde"} fue desplazada`);
                }
              } else {
                if (!ballB.boched) {
                  applyBoche(ballB, ballA);
                  ballB.boched = true;
                  addMessage(`💥 ¡BOCHE! Bola ${ballB.owner === 1 ? "Roja" : "Verde"} fue desplazada`);
                }
              }
            }
          }
        }
        
        // Resolver colisiones físicas normales
        const allMoving = [gs.moche, ...playedBalls];
        for (let i = 0; i < allMoving.length; i++)
          for (let j = i + 1; j < allMoving.length; j++)
            if (dist(allMoving[i], allMoving[j]) < allMoving[i].r + allMoving[j].r)
              resolveCollision(allMoving[i], allMoving[j]);
        
        if (!anyMoving) endOfThrow();
      }, [endOfThrow]);

      const throwMoche = React.useCallback((fromX, fromY, toX, toY) => {
        const gs = stateRef.current;
        const dx = toX - fromX, dy = toY - fromY;
        const len = Math.hypot(dx, dy) || 1;
        const power = clamp(len / 3, 3, MAX_POWER * 0.7);
        gs.moche.x = fromX; gs.moche.y = fromY;
        gs.moche.vx = (dx / len) * power;
        gs.moche.vy = (dy / len) * power;
        gs.phase = "rolling";
        refreshUi();
        addMessage("🎯 Lanzando moche...");
      }, []);

      const throwBall = React.useCallback((fromX, fromY, toX, toY) => {
        const gs = stateRef.current;
        
        // Validar regla de bola más lejana ANTES de lanzar
        if (!isValidTurn(gs)) {
          if (!gs.repeatThrowAvailable) {
            addMessage(`❌ ¡No es tu turno! Debe tirar quien tiene la bola MÁS LEJANA al moche. Puedes repetir el tiro.`, true);
            gs.repeatThrowAvailable = true;
            refreshUi();
            return;
          } else {
            addMessage(`🔄 Tiro repetido permitido (no eras el más lejano)`, false);
          }
        } else {
          gs.repeatThrowAvailable = false;
        }
        
        const unplayed = gs.balls.filter(b => b.owner === gs.turn && !b.played);
        if (!unplayed.length) return;
        const b = unplayed[0];
        const bankIdx = parseInt(b.id.split("_")[1]);
        b.x = b.owner === 1 ? W - 50 - bankIdx * (BOLA_R * 2 + 5) : 50 + bankIdx * (BOLA_R * 2 + 5);
        b.y = H - 35;
        const dx = toX - fromX, dy = toY - fromY;
        const len = Math.hypot(dx, dy) || 1;
        const power = clamp(len / 3, 2, MAX_POWER);
        b.vx = (dx / len) * power;
        b.vy = (dy / len) * power;
        b.played = true;
        b.wallHit = false;
        b.boched = false;
        gs.phase = "rolling";
        refreshUi();
        addMessage(`🎳 Jugador ${gs.turn === 1 ? "Rojo" : "Verde"} lanzó bola ${bankIdx + 1}`);
      }, []);

      const draw = React.useCallback(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext("2d");
        const gs = stateRef.current;
        const aim = aimRef.current;

        // Fondo
        const grad = ctx.createLinearGradient(0, 0, 0, H);
        grad.addColorStop(0, "#c8a96e");
        grad.addColorStop(1, "#a0784a");
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, W, H);
        
        // Zona de pared (zona prohibida visual)
        ctx.strokeStyle = "#ff0000aa";
        ctx.lineWidth = 2;
        ctx.setLineDash([5, 5]);
        ctx.strokeRect(WALL_PENALTY_DIST, WALL_PENALTY_DIST, W - WALL_PENALTY_DIST * 2, H - WALL_PENALTY_DIST * 2);
        ctx.setLineDash([]);
        
        // Círculos de puntuación alrededor del moche
        if (gs.mocheThrown) {
          [30, 50, 80, 120].forEach((radius, idx) => {
            ctx.beginPath();
            ctx.arc(gs.moche.x, gs.moche.y, radius, 0, Math.PI * 2);
            ctx.strokeStyle = `rgba(244, 208, 63, ${0.3 - idx * 0.05})`;
            ctx.lineWidth = 1.5;
            ctx.stroke();
            if (idx === 0) {
              ctx.fillStyle = "rgba(244, 208, 63, 0.1)";
              ctx.fill();
            }
          });
        }
        
        ctx.strokeStyle = "#7a5c2e";
        ctx.lineWidth = 8;
        ctx.strokeRect(4, 4, W - 8, H - 8);
        
        ctx.setLineDash([12, 8]);
        ctx.strokeStyle = "rgba(255,255,255,0.15)";
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(W / 2, 20); ctx.lineTo(W / 2, H - 20); ctx.stroke();
        ctx.setLineDash([]);

        // Dibujar moche
        if (gs.mocheThrown) {
          const m = gs.moche;
          const mg = ctx.createRadialGradient(m.x - 3, m.y - 3, 1, m.x, m.y, m.r);
          mg.addColorStop(0, "#ffe169"); mg.addColorStop(1, "#f0a500");
          ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2);
          ctx.fillStyle = mg; ctx.fill();
          ctx.strokeStyle = "#c8860a"; ctx.lineWidth = 2; ctx.stroke();
          ctx.fillStyle = "#7a5c00"; ctx.font = "bold 8px serif";
          ctx.textAlign = "center"; ctx.fillText("M", m.x, m.y + 3);
        }

        // Dibujar bolas jugadas
        gs.balls.forEach(b => {
          if (!b.played) return;
          // Efecto visual si tocó pared
          if (b.wallHit) {
            ctx.strokeStyle = "#ff0000";
            ctx.lineWidth = 3;
            ctx.beginPath(); ctx.arc(b.x, b.y, b.r + 2, 0, Math.PI * 2);
            ctx.stroke();
          }
          const bg = ctx.createRadialGradient(b.x - 5, b.y - 5, 2, b.x, b.y, b.r);
          bg.addColorStop(0, lighten(b.color)); bg.addColorStop(0.6, b.color); bg.addColorStop(1, darken(b.color));
          ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
          ctx.fillStyle = bg; ctx.fill();
          ctx.strokeStyle = "rgba(0,0,0,0.3)"; ctx.lineWidth = 1.5; ctx.stroke();
          ctx.fillStyle = "#fff"; ctx.font = `bold ${b.r * 0.75}px serif`;
          ctx.textAlign = "center"; ctx.fillText(parseInt(b.id.split("_")[1]) + 1, b.x, b.y + 4);
        });

        // Dibujar bolas sin jugar
        gs.balls.forEach(b => {
          if (b.played) return;
          const bx = b.owner === 1 ? W - 50 - parseInt(b.id.split("_")[1]) * (BOLA_R * 2 + 5) : 50 + parseInt(b.id.split("_")[1]) * (BOLA_R * 2 + 5);
          const by = H - 35;
          const bg = ctx.createRadialGradient(bx - 4, by - 4, 1, bx, by, BOLA_R - 2);
          bg.addColorStop(0, lighten(b.color)); bg.addColorStop(1, b.color);
          ctx.beginPath(); ctx.arc(bx, by, BOLA_R - 2, 0, Math.PI * 2);
          ctx.fillStyle = bg; ctx.fill();
          ctx.strokeStyle = "rgba(255,255,255,0.3)"; ctx.lineWidth = 1; ctx.stroke();
          ctx.fillStyle = "#fff"; ctx.font = `bold ${BOLA_R - 4}px serif`;
          ctx.textAlign = "center"; ctx.fillText(parseInt(b.id.split("_")[1]) + 1, bx, by + 4);
        });

        // Línea de apuntado
        if (aim.active && gs.phase === "aim") {
          const dx = aim.endX - aim.startX, dy = aim.endY - aim.startY;
          const len = Math.hypot(dx, dy);
          const power = Math.min(len / 3, MAX_POWER);
          const nx = dx / (len || 1), ny = dy / (len || 1);
          ctx.setLineDash([6, 6]);
          ctx.strokeStyle = gs.turn === 1 ? "rgba(230,57,70,0.8)" : "rgba(46,204,113,0.8)";
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(aim.startX, aim.startY);
          ctx.lineTo(aim.startX + nx * power * 12, aim.startY + ny * power * 12);
          ctx.stroke();
          ctx.setLineDash([]);
          const barW = 120, barH = 12;
