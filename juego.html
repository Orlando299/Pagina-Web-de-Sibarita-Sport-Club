<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Bolas Criollas - 2 Jugadores Funcional</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }
    body {
      background: #0a0a0a;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', Arial, sans-serif;
    }
    .game-container {
      background: #1a1a2e;
      border-radius: 24px;
      padding: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    canvas {
      display: block;
      margin: 0 auto;
      border-radius: 16px;
      box-shadow: 0 0 20px rgba(244,208,63,0.3);
      cursor: crosshair;
      touch-action: none;
    }
    .info-panel {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 40px;
      margin-bottom: 20px;
      padding: 15px 30px;
      background: rgba(0,0,0,0.6);
      border-radius: 60px;
      backdrop-filter: blur(10px);
    }
    .player {
      text-align: center;
      padding: 8px 30px;
      border-radius: 40px;
      transition: all 0.3s;
    }
    .player.red {
      background: linear-gradient(135deg, rgba(230,57,70,0.2), rgba(230,57,70,0.05));
      border: 1px solid #e63946;
    }
    .player.green {
      background: linear-gradient(135deg, rgba(46,204,113,0.2), rgba(46,204,113,0.05));
      border: 1px solid #2ecc71;
    }
    .player.active {
      transform: scale(1.05);
      box-shadow: 0 0 20px currentColor;
    }
    .player.red.active { border-color: #e63946; box-shadow: 0 0 15px #e63946; }
    .player.green.active { border-color: #2ecc71; box-shadow: 0 0 15px #2ecc71; }
    .score {
      font-size: 42px;
      font-weight: bold;
      line-height: 1;
    }
    .player.red .score { color: #e63946; }
    .player.green .score { color: #2ecc71; }
    .player-name {
      font-size: 14px;
      letter-spacing: 2px;
      margin-top: 5px;
    }
    .round-box {
      text-align: center;
      background: rgba(244,208,63,0.15);
      padding: 8px 20px;
      border-radius: 40px;
      border: 1px solid #f4d03f;
    }
    .round-label {
      font-size: 10px;
      color: #f4d03f;
      letter-spacing: 2px;
    }
    .round-number {
      font-size: 28px;
      font-weight: bold;
      color: #f4d03f;
    }
    button {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      padding: 8px 20px;
      border-radius: 30px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
      margin: 0 5px;
    }
    button:active {
      transform: scale(0.95);
    }
    .controls {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 15px;
    }
    .toast {
      position: fixed;
      bottom: 30px;
      right: 30px;
      background: #f4d03f;
      color: #1a0a00;
      padding: 12px 24px;
      border-radius: 40px;
      font-weight: bold;
      animation: slideIn 0.3s ease;
      z-index: 1000;
    }
    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
  </style>
</head>
<body>
<div>
  <div class="game-container">
    <div class="info-panel">
      <div class="player red" id="playerRed">
        <div class="score" id="scoreRed">0</div>
        <div class="player-name">🔴 ROJO</div>
      </div>
      <div class="round-box">
        <div class="round-label">RONDA</div>
        <div class="round-number" id="roundNum">1/3</div>
      </div>
      <div class="player green" id="playerGreen">
        <div class="score" id="scoreGreen">0</div>
        <div class="player-name">🟢 VERDE</div>
      </div>
    </div>
    
    <canvas id="gameCanvas" width="900" height="550" style="width:100%;max-width:900px;height:auto"></canvas>
    
    <div class="controls">
      <button id="resetBtn">🔄 REINICIAR JUEGO</button>
      <button id="modeBtn">👥 MODO 2 JUGADORES</button>
    </div>
  </div>
  <div id="toast" class="toast" style="display:none"></div>
</div>

<script>
  // =====================================================
  // BOLAS CRIOLLAS - VERSIÓN SIMPLIFICADA Y FUNCIONAL
  // =====================================================
  
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  
  // Dimensiones
  const W = 900;
  const H = 550;
  canvas.width = W;
  canvas.height = H;
  
  // Constantes del juego
  const MINGO_R = 10;
  const BOLA_R = 16;
  const FRICTION = 0.985;
  const MIN_SPEED = 0.5;
  const MAX_POWER = 18;
  const BALLS_PER_PLAYER = 4;
  const WALL_PENALTY = 35;
  
  // Colores de las bolas
  const RED_COLORS = ['#e63946', '#c1121f', '#ff6b6b', '#ff9a9e'];
  const GREEN_COLORS = ['#2ecc71', '#27ae60', '#58d68d', '#82e0aa'];
  
  // Estado del juego
  let mingo = { x: W/2, y: H/3, vx: 0, vy: 0 };
  let balls = [];
  let currentTurn = 1; // 1 = Rojo, 2 = Verde
  let scores = {1: 0, 2: 0};
  let currentRound = 1;
  const MAX_ROUNDS = 3;
  let mingoPlanted = false;
  let gamePhase = 'aim'; // aim, rolling, end
  let gameWinner = null;
  let modeIA = false;
  
  // Variables de lanzamiento
  let isDragging = false;
  let dragStart = { x: 0, y: 0 };
  let dragEnd = { x: 0, y: 0 };
  
  // Animación
  let animationId = null;
  
  // ============ FUNCIONES AUXILIARES ============
  function showMessage(msg, isError = false) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.style.background = isError ? '#e74c3c' : '#f4d03f';
    toast.style.display = 'block';
    setTimeout(() => { toast.style.display = 'none'; }, 2500);
  }
  
  function updateUI() {
    document.getElementById('scoreRed').textContent = scores[1];
    document.getElementById('scoreGreen').textContent = scores[2];
    document.getElementById('roundNum').textContent = `${currentRound}/${MAX_ROUNDS}`;
    
    const redDiv = document.getElementById('playerRed');
    const greenDiv = document.getElementById('playerGreen');
    
    if (gamePhase === 'aim' && !gameWinner) {
      if (currentTurn === 1) {
        redDiv.classList.add('active');
        greenDiv.classList.remove('active');
      } else {
        greenDiv.classList.add('active');
        redDiv.classList.remove('active');
      }
    } else {
      redDiv.classList.remove('active');
      greenDiv.classList.remove('active');
    }
  }
  
  function distance(p1, p2) {
    return Math.hypot(p1.x - p2.x, p1.y - p2.y);
  }
  
  function clamp(value, min, max) {
    return Math.max(min, Math.min(max, value));
  }
  
  // ============ INICIALIZACIÓN ============
  function initGame() {
    // Mingo
    mingo = { x: W/2, y: H/3, vx: 0, vy: 0 };
    
    // Bolas
    balls = [];
    
    // Bolas rojas (izquierda)
    for (let i = 0; i < BALLS_PER_PLAYER; i++) {
      balls.push({
        id: `r${i}`,
        owner: 1,
        x: 60 + i * (BOLA_R * 2 + 10),
        y: H - 50,
        vx: 0, vy: 0,
        color: RED_COLORS[i],
        played: false,
        wallHit: false,
        boched: false
      });
    }
    
    // Bolas verdes (derecha)
    for (let i = 0; i < BALLS_PER_PLAYER; i++) {
      balls.push({
        id: `g${i}`,
        owner: 2,
        x: W - 60 - i * (BOLA_R * 2 + 10),
        y: H - 50,
        vx: 0, vy: 0,
        color: GREEN_COLORS[i],
        played: false,
        wallHit: false,
        boched: false
      });
    }
    
    currentTurn = 1;
    mingoPlanted = false;
    gamePhase = 'aim';
    gameWinner = null;
    
    updateUI();
    draw();
    showMessage('🎯 Arrastra para lanzar el MINGO');
  }
  
  // ============ FÍSICA ============
  function checkWallHit(ball) {
    return (ball.x - ball.r < WALL_PENALTY || 
            ball.x + ball.r > W - WALL_PENALTY ||
            ball.y - ball.r < WALL_PENALTY || 
            ball.y + ball.r > H - WALL_PENALTY);
  }
  
  function resolveCollision(a, b) {
    const dx = b.x - a.x;
    const dy = b.y - a.y;
    const dist = Math.hypot(dx, dy);
    if (dist === 0) return;
    
    const overlap = (a.r + b.r) - dist;
    if (overlap <= 0) return;
    
    const nx = dx / dist;
    const ny = dy / dist;
    
    // Separar
    a.x -= nx * overlap / 2;
    a.y -= ny * overlap / 2;
    b.x += nx * overlap / 2;
    b.y += ny * overlap / 2;
    
    // Intercambiar velocidades
    const vRelX = b.vx - a.vx;
    const vRelY = b.vy - a.vy;
    const dot = vRelX * nx + vRelY * ny;
    if (dot < 0) {
      const e = 0.7;
      const imp = (1 + e) * dot / 2;
      a.vx += imp * nx;
      a.vy += imp * ny;
      b.vx -= imp * nx;
      b.vy -= imp * ny;
    }
  }
  
  function updatePhysics() {
    if (gamePhase !== 'rolling') return;
    
    let anyMoving = false;
    const movingObjects = [];
    
    if (mingo.vx !== 0 || mingo.vy !== 0) {
      movingObjects.push(mingo);
      anyMoving = true;
    }
    
    balls.forEach(ball => {
      if (ball.played && (ball.vx !== 0 || ball.vy !== 0)) {
        movingObjects.push(ball);
        anyMoving = true;
      }
    });
    
    movingObjects.forEach(obj => {
      obj.x += obj.vx;
      obj.y += obj.vy;
      obj.vx *= FRICTION;
      obj.vy *= FRICTION;
      
      // Bordes
      if (obj.x - obj.r < 0) { obj.x = obj.r; obj.vx *= -0.5; }
      if (obj.x + obj.r > W) { obj.x = W - obj.r; obj.vx *= -0.5; }
      if (obj.y - obj.r < 0) { obj.y = obj.r; obj.vy *= -0.5; }
      if (obj.y + obj.r > H) { obj.y = H - obj.r; obj.vy *= -0.5; }
      
      if (Math.abs(obj.vx) < MIN_SPEED) obj.vx = 0;
      if (Math.abs(obj.vy) < MIN_SPEED) obj.vy = 0;
    });
    
    // Colisiones entre bolas jugadas
    const playedBalls = balls.filter(b => b.played);
    for (let i = 0; i < playedBalls.length; i++) {
      for (let j = i + 1; j < playedBalls.length; j++) {
        if (distance(playedBalls[i], playedBalls[j]) < playedBalls[i].r + playedBalls[j].r) {
          resolveCollision(playedBalls[i], playedBalls[j]);
        }
      }
    }
    
    // Colisiones con Mingo
    if (mingoPlanted) {
      playedBalls.forEach(ball => {
        if (distance(mingo, ball) < mingo.r + ball.r) {
          resolveCollision(mingo, ball);
        }
      });
    }
    
    if (!anyMoving && movingObjects.length === 0) {
      endOfTurn();
    }
    
    draw();
  }
  
  // ============ LÓGICA DEL JUEGO ============
  function getFarthestBallOwner() {
    const validBalls = balls.filter(b => b.played && !b.wallHit);
    if (validBalls.length === 0) return currentTurn;
    
    let farthest = null;
    let maxDist = -1;
    validBalls.forEach(ball => {
      const d = distance(ball, mingo);
      if (d > maxDist) {
        maxDist = d;
        farthest = ball;
      }
    });
    return farthest ? farthest.owner : currentTurn;
  }
  
  function endOfTurn() {
    // Verificar si la última bola tocó pared
    const lastBall = balls.filter(b => b.played && !b.wallHit).pop();
    if (lastBall && checkWallHit(lastBall)) {
      lastBall.wallHit = true;
      showMessage('⚠️ Bola anulada: tocó la pared', true);
    }
    
    const unplayedBalls = balls.filter(b => !b.played);
    
    // Si el Mingo no está plantado
    if (!mingoPlanted) {
      gamePhase = 'aim';
      mingoPlanted = true;
      updateUI();
      showMessage('🎯 Mingo plantado. Ahora lanza tus bolas');
      draw();
      return;
    }
    
    // Si quedan bolas por lanzar
    if (unplayedBalls.length > 0) {
      const nextPlayer = getFarthestBallOwner();
      if (nextPlayer !== currentTurn) {
        currentTurn = nextPlayer;
        showMessage(currentTurn === 1 ? '🔴 Turno del Rojo' : '🟢 Turno del Verde');
      }
      gamePhase = 'aim';
      updateUI();
      draw();
      
      // IA
      if (modeIA && currentTurn === 2 && gamePhase === 'aim') {
        setTimeout(() => aiThrow(), 600);
      }
      return;
    }
    
    // Fin de la ronda - calcular ganador
    const validBalls = balls.filter(b => b.played && !b.wallHit);
    let distRed = Infinity, distGreen = Infinity;
    validBalls.forEach(b => {
      const d = distance(b, mingo);
      if (b.owner === 1 && d < distRed) distRed = d;
      if (b.owner === 2 && d < distGreen) distGreen = d;
    });
    
    let roundWinner = null;
    if (distRed < distGreen && distRed !== Infinity) {
      roundWinner = 1;
      const points = validBalls.filter(b => b.owner === 1 && distance(b, mingo) < distGreen).length;
      scores[1] += points;
      showMessage(`✅ Ronda ${currentRound}: Rojo gana +${points} punto(s)`);
    } else if (distGreen < distRed && distGreen !== Infinity) {
      roundWinner = 2;
      const points = validBalls.filter(b => b.owner === 2 && distance(b, mingo) < distRed).length;
      scores[2] += points;
      showMessage(`✅ Ronda ${currentRound}: Verde gana +${points} punto(s)`);
    } else {
      showMessage(`🤝 Ronda ${currentRound}: Empate`);
    }
    
    updateUI();
    
    // Verificar fin del juego
    if (currentRound >= MAX_ROUNDS) {
      gameWinner = scores[1] > scores[2] ? 1 : scores[2] > scores[1] ? 2 : 0;
      gamePhase = 'end';
      showMessage(gameWinner === 0 ? '¡EMPATE FINAL!' : `🏆 ${gameWinner === 1 ? 'ROJO' : 'VERDE'} GANA EL JUEGO!`);
      updateUI();
      draw();
      return;
    }
    
    // Siguiente ronda
    currentRound++;
    // Reiniciar bolas pero mantener puntajes
    const newBalls = [];
    for (let i = 0; i < BALLS_PER_PLAYER; i++) {
      newBalls.push({
        id: `r${i}`, owner: 1, r: BOLA_R,
        x: 60 + i * (BOLA_R * 2 + 10), y: H - 50,
        vx: 0, vy: 0, color: RED_COLORS[i], played: false, wallHit: false, boched: false
      });
    }
    for (let i = 0; i < BALLS_PER_PLAYER; i++) {
      newBalls.push({
        id: `g${i}`, owner: 2, r: BOLA_R,
        x: W - 60 - i * (BOLA_R * 2 + 10), y: H - 50,
        vx: 0, vy: 0, color: GREEN_COLORS[i], played: false, wallHit: false, boched: false
      });
    }
    balls = newBalls;
    mingo = { x: W/2, y: H/3, vx: 0, vy: 0 };
    mingoPlanted = false;
    currentTurn = roundWinner || 1;
    gamePhase = 'aim';
    updateUI();
    showMessage(`🎲 RONDA ${currentRound} - Comienza ${currentTurn === 1 ? 'Rojo' : 'Verde'}`);
    draw();
  }
  
  // ============ LANZAMIENTOS ============
  function throwMingo(fromX, fromY, toX, toY) {
    const dx = toX - fromX;
    const dy = toY - fromY;
    const len = Math.hypot(dx, dy);
    if (len === 0) return;
    
    const power = Math.min(len / 2.8, MAX_POWER * 0.8);
    mingo.x = fromX;
    mingo.y = fromY;
    mingo.vx = (dx / len) * power;
    mingo.vy = (dy / len) * power;
    gamePhase = 'rolling';
    updateUI();
    showMessage('🎯 Lanzando Mingo...');
  }
  
  function throwBall(fromX, fromY, toX, toY) {
    const availableBalls = balls.filter(b => b.owner === currentTurn && !b.played);
    if (availableBalls.length === 0) {
      showMessage('⚠️ No te quedan bolas', true);
      return;
    }
    
    const ball = availableBalls[0];
    const idx = parseInt(ball.id.substring(1));
    
    // Posicionar en punto de salida
    if (ball.owner === 1) {
      ball.x = 60 + idx * (BOLA_R * 2 + 10);
      ball.y = H - 50;
    } else {
      ball.x = W - 60 - idx * (BOLA_R * 2 + 10);
      ball.y = H - 50;
    }
    
    const dx = toX - fromX;
    const dy = toY - fromY;
    const len = Math.hypot(dx, dy);
    if (len === 0) return;
    
    const power = Math.min(len / 2.5, MAX_POWER);
    ball.vx = (dx / len) * power;
    ball.vy = (dy / len) * power;
    ball.played = true;
    ball.wallHit = false;
    ball.boched = false;
    
    gamePhase = 'rolling';
    updateUI();
    showMessage(`🎳 ${currentTurn === 1 ? 'Rojo' : 'Verde'} lanzó bola ${idx + 1}`);
  }
  
  // IA simple
  function aiThrow() {
    if (gamePhase !== 'aim' || currentTurn !== 2) return;
    
    const availableBalls = balls.filter(b => b.owner === 2 && !b.played);
    if (availableBalls.length === 0) return;
    
    const ball = availableBalls[0];
    const idx = parseInt(ball.id.substring(1));
    const startX = W - 60 - idx * (BOLA_R * 2 + 10);
    const startY = H - 50;
    
    // Apuntar cerca del Mingo
    let targetX = mingo.x + (Math.random() - 0.5) * 70;
    let targetY = mingo.y + (Math.random() - 0.5) * 70;
    targetX = clamp(targetX, 50, W - 50);
    targetY = clamp(targetY, 60, H - 60);
    
    const dx = targetX - startX;
    const dy = targetY - startY;
    const len = Math.hypot(dx, dy);
    const power = Math.min(len / 2.5, MAX_POWER);
    
    ball.x = startX;
    ball.y = startY;
    ball.vx = (dx / len) * power;
    ball.vy = (dy / len) * power;
    ball.played = true;
    
    gamePhase = 'rolling';
    updateUI();
    showMessage('🤖 IA lanzando...');
  }
  
  // ============ DIBUJO ============
  function draw() {
    ctx.clearRect(0, 0, W, H);
    
    // Fondo de cancha
    const grad = ctx.createLinearGradient(0, 0, W, H);
    grad.addColorStop(0, '#8B6914');
    grad.addColorStop(1, '#C4A35A');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
    
    // Líneas de perspectiva
    ctx.strokeStyle = 'rgba(255,255,255,0.1)';
    ctx.lineWidth = 1;
    for (let i = 0; i < H; i += 40) {
      ctx.beginPath();
      ctx.moveTo(0, i);
      ctx.lineTo(W, i);
      ctx.stroke();
    }
    
    // Zona de pared (prohibida)
    ctx.strokeStyle = '#ff0000aa';
    ctx.setLineDash([5, 5]);
    ctx.strokeRect(WALL_PENALTY, WALL_PENALTY, W - WALL_PENALTY * 2, H - WALL_PENALTY * 2);
    ctx.setLineDash([]);
    
    // Bordes
    ctx.strokeStyle = '#5C4010';
    ctx.lineWidth = 8;
    ctx.strokeRect(5, 5, W - 10, H - 10);
    ctx.strokeStyle = '#D4B05A';
    ctx.lineWidth = 2;
    ctx.strokeRect(10, 10, W - 20, H - 20);
    
    // Línea central
    ctx.beginPath();
    ctx.moveTo(W/2, 15);
    ctx.lineTo(W/2, H-15);
    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.setLineDash([10, 10]);
    ctx.stroke();
    ctx.setLineDash([]);
    
    // Círculos de puntuación
    if (mingoPlanted) {
      [30, 55, 85, 120].forEach((r, i) => {
        ctx.beginPath();
        ctx.arc(mingo.x, mingo.y, r, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(244,208,63,${0.3 - i * 0.05})`;
        ctx.stroke();
      });
    }
    
    // Mingo
    if (mingoPlanted) {
      ctx.beginPath();
      ctx.arc(mingo.x, mingo.y, MINGO_R, 0, Math.PI * 2);
      ctx.fillStyle = '#f4d03f';
      ctx.fill();
      ctx.fillStyle = '#d4a017';
      ctx.font = 'bold 12px serif';
      ctx.textAlign = 'center';
      ctx.fillText('⚜️', mingo.x, mingo.y + 4);
    } else if (!mingoPlanted && gamePhase === 'aim') {
      // Mostrar texto indicador
      ctx.font = 'bold 14px sans-serif';
      ctx.fillStyle = 'rgba(244,208,63,0.7)';
      ctx.textAlign = 'center';
      ctx.fillText('⬅️ ARRASTRA PARA LANZAR EL MINGO ➡️', W/2, H/2 - 50);
    }
    
    // Bolas jugadas
    balls.forEach(ball => {
      if (!ball.played) return;
      
      if (ball.wallHit) {
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.r + 2, 0, Math.PI * 2);
        ctx.strokeStyle = '#ff0000';
        ctx.lineWidth = 2;
        ctx.stroke();
      }
      
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
      ctx.fillStyle = ball.color;
      ctx.fill();
      ctx.fillStyle = 'white';
      ctx.font = `bold ${ball.r * 0.7}px serif`;
      ctx.fillText(parseInt(ball.id.substring(1)) + 1, ball.x, ball.y + 5);
    });
    
    // Bolas sin jugar
    balls.forEach(ball => {
      if (ball.played) return;
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r - 1, 0, Math.PI * 2);
      ctx.fillStyle = ball.color;
      ctx.fill();
      ctx.fillStyle = 'white';
      ctx.font = `bold ${ball.r - 4}px serif`;
      ctx.fillText(parseInt(ball.id.substring(1)) + 1, ball.x, ball.y + 4);
    });
    
    // Línea de lanzamiento
    if (isDragging && gamePhase === 'aim') {
      const dx = dragEnd.x - dragStart.x;
      const dy = dragEnd.y - dragStart.y;
      const len = Math.hypot(dx, dy);
      const power = Math.min(len / 2.5, MAX_POWER);
      const nx = dx / (len || 1);
      const ny = dy / (len || 1);
      
      ctx.setLineDash([6, 6]);
      ctx.beginPath();
      ctx.moveTo(dragStart.x, dragStart.y);
      ctx.lineTo(dragStart.x + nx * power * 14, dragStart.y + ny * power * 14);
      ctx.strokeStyle = currentTurn === 1 ? '#e63946' : '#2ecc71';
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.setLineDash([]);
      
      // Barra de potencia
      const barW = 140;
      const barH = 12;
      const barX = dragStart.x - barW/2;
      const barY = dragStart.y + 30;
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(barX, barY, barW, barH);
      const pct = power / MAX_POWER;
      ctx.fillStyle = pct < 0.4 ? '#2ecc71' : pct < 0.7 ? '#f39c12' : '#e74c3c';
      ctx.fillRect(barX + 2, barY + 2, (barW - 4) * pct, barH - 4);
      ctx.fillStyle = 'white';
      ctx.font = '10px monospace';
      ctx.fillText(`⚡ ${Math.round(pct * 100)}%`, dragStart.x, barY + barH + 14);
    }
    
    // Pantalla de fin del juego
    if (gamePhase === 'end' && gameWinner) {
      ctx.fillStyle = 'rgba(0,0,0,0.85)';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#f4d03f';
      ctx.font = 'bold 36px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(gameWinner === 1 ? '🏆 ROJO GANA! 🏆' : '🏆 VERDE GANA! 🏆', W/2, H/2);
      ctx.font = '20px sans-serif';
      ctx.fillStyle = 'white';
      ctx.fillText(`${scores[1]} - ${scores[2]}`, W/2, H/2 + 60);
    }
  }
  
  // ============ EVENTOS ============
  function getCanvasCoords(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = W / rect.width;
    const scaleY = H / rect.height;
    
    let clientX, clientY;
    if (e.touches) {
      clientX = e.touches[0].clientX;
      clientY = e.touches[0].clientY;
    } else {
      clientX = e.clientX;
      clientY = e.clientY;
    }
    
    return {
      x: (clientX - rect.left) * scaleX,
      y: (clientY - rect.top) * scaleY
    };
  }
  
  function onPointerDown(e) {
    e.preventDefault();
    if (gamePhase !== 'aim') return;
    const coords = getCanvasCoords(e);
    isDragging = true;
    dragStart.x = coords.x;
    dragStart.y = coords.y;
    dragEnd.x = coords.x;
    dragEnd.y = coords.y;
    draw();
  }
  
  function onPointerMove(e) {
    if (!isDragging) return;
    e.preventDefault();
    const coords = getCanvasCoords(e);
    dragEnd.x = clamp(coords.x, 0, W);
    dragEnd.y = clamp(coords.y, 0, H);
    draw();
  }
  
  function onPointerUp(e) {
    if (!isDragging) return;
    e.preventDefault();
    isDragging = false;
    
    const fromX = dragStart.x;
    const fromY = dragStart.y;
    const toX = dragEnd.x;
    const toY = dragEnd.y;
    
    if (!mingoPlanted) {
      throwMingo(fromX, fromY, toX, toY);
    } else {
      throwBall(fromX, fromY, toX, toY);
    }
    draw();
  }
  
  // ============ CONTROLES ============
  function resetGame() {
    if (animationId) cancelAnimationFrame(animationId);
    initGame();
    animationId = requestAnimationFrame(gameLoop);
  }
  
  function toggleMode() {
    modeIA = !modeIA;
    resetGame();
    const btn = document.getElementById('modeBtn');
    btn.textContent = modeIA ? '🤖 VS COMPUTADORA' : '👥 MODO 2 JUGADORES';
    showMessage(modeIA ? 'Modo VS Computadora activado' : 'Modo 2 Jugadores activado');
  }
  
  // ============ GAME LOOP ============
  function gameLoop() {
    updatePhysics();
    animationId = requestAnimationFrame(gameLoop);
  }
  
  // ============ INICIALIZAR EVENTOS ============
  canvas.addEventListener('mousedown', onPointerDown);
  canvas.addEventListener('mousemove', onPointerMove);
  canvas.addEventListener('mouseup', onPointerUp);
  canvas.addEventListener('touchstart', onPointerDown);
  canvas.addEventListener('touchmove', onPointerMove);
  canvas.addEventListener('touchend', onPointerUp);
  
  document.getElementById('resetBtn').addEventListener('click', resetGame);
  document.getElementById('modeBtn').addEventListener('click', toggleMode);
  
  // Iniciar juego
  initGame();
  animationId = requestAnimationFrame(gameLoop);
</script>
</body>
</html>
